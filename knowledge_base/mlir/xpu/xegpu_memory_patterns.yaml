kb_schema_version: 1
# XeGPU Workgroup-Level Memory-Access Patterns
# Prefetching, cache hints, and coalesced 2D block loads for WG-level XeGPU.
#
# Every rule triggers on IR features — which ops carry which layout, what the loop
# streams, where a transpose sits — not on the workload. Attention/GEMM appear only
# as MEASURED INSTANCE blocks recording where a number came from and under what
# conditions; do not read them as preconditions.
language: mlir
device: xpu
category: optimization

constraints:
  - id: xegpu_no_dead_prefetch_reads
    name: A prefetch whose loaded value is unused is dead code (no-op)
    severity: critical
    description: |
      Every "optimization" must change the code the compiler actually keeps.
      Adding a vector.transfer_read / xegpu.load whose result feeds nothing is
      dead code: MLIR's DCE removes it, so the kernel lowers to IR byte-identical
      to the original and runs at the same speed. Any measured "speedup" is
      timing noise, and the verifier now rejects such edits (it compares the
      LOWERED IR of the two variants and fails a no-op).

      A REAL software prefetch must either (a) be a side-effecting op the target
      supports — NOTE memref.prefetch does NOT legalize on Intel Xe (LLVM ERROR:
      unable to legalize G_PREFETCH), so it is not an option here — or (b) use
      xegpu.prefetch_nd on a live xegpu.tensor_desc (only available once the
      kernel is in load_nd block-load form; see xegpu_add_prefetch_nd). If you
      cannot express a real prefetch for the kernel in front of you, do not
      emit one — report no change instead.

      Option (b) is necessary but not enough. An xegpu.prefetch_nd on a live
      tensor_desc still does nothing useful if its OFFSET equals the offset of the
      load_nd it shadows. That form is not dead code — prefetch_nd has no result, so
      DCE keeps it and the lowered IR differs, which means the verifier's no-op check
      passes it. It is the second way to write a prefetch that cannot help. Always
      check the offset too: xegpu_prefetch_must_lead_the_load.

  - id: xegpu_contiguous_2d_block_load
    name: load_nd tiles should map to contiguous 2D block loads
    severity: high
    description: |
      xegpu.load_nd reads a 2D tile described by create_nd_tdesc. For the load
      to coalesce, the tile's inner (fastest) dimension must be contiguous in
      memory and sized to the hardware block-load width. Mismatched sg_data /
      order forces gathered or strided loads that waste bandwidth.

  - id: xegpu_2d_block_alignment
    name: 2D-block load/prefetch fast path needs stride-1 inner dim + OWord-aligned pitch
    severity: high
    stage: device_specific
    description: |
      The fast hardware 2D-block read/prefetch behind xegpu.load_nd /
      xegpu.prefetch_nd is only taken when the descriptor's memory meets
      alignment/contiguity preconditions. Distilled from Intel's
      MaterializeBlockPointer (satisfies2DBlockReadAlignment): the fast-changing
      (inner) dimension must be stride-1 contiguous; the OTHER stride (the pitch)
      must be a multiple of 128 bits = one OWord (i.e. a multiple of
      ceil(128/elem_bits) elements); the base pointer must be 4-byte aligned; and
      the surface pitch 16-byte aligned. Tiling that produces a pitch which breaks
      16-byte alignment silently falls off the fast path to a slow gather. Also
      AVOID the 2D-block path for a transposed row-major first (A) dot operand and
      for column-major fp8 — both are measured regressions on Intel HW.
      Practical rule for the LLM: keep create_nd_tdesc shapes/strides so the inner
      dim is unit-stride and the leading (row) stride is a multiple of 16 bytes;
      do NOT choose sg_data/tile widths that make the row stride non-16B-aligned.

  - id: xegpu_bmg_b580_2d_block_message_limits
    name: "BMG B580 2D-block message limits: 64-byte max width; load up to 32 rows, prefetch up to 8 rows"
    severity: high
    stage: device_specific
    description: |
      Hardware limits of the Intel Xe2 BMG B580 2D-block load/prefetch engine that
      bound the inst_data (per-hardware-message block) of xegpu.load_nd and
      xegpu.prefetch_nd. Choose inst_data so each message fits these caps; an
      inst_data larger than a cap is legal but the compiler SPLITS it into multiple
      hardware messages (more send traffic), so oversizing prefetch rows in
      particular is wasteful.
        * WIDTH (inner / fastest dim): max 64 BYTES per row per message. For f16
          (2 B) that is 32 elements -> inst_data inner dim <= 32; for f32 (4 B) it is
          16 elements -> inner dim <= 16; for i8 (1 B), 64.
        * ROWS (outer dim) PER MESSAGE differ by op:
            - LOAD (xegpu.load_nd):     up to 32 rows per message.
            - PREFETCH (xegpu.prefetch_nd): up to 8 rows per message.
      So for f16, inst_data = [16, 32] is a safe, well-formed block for BOTH load and
      prefetch (16 rows x 32 cols = 64 B wide). load can go up to [32, 32] in one
      message; a prefetch inst_data with > 8 rows (e.g. [16,32] or [32,16]) is split
      into ceil(rows/8) messages. Keep the WIDTH <= 64 B for either op — exceeding it
      falls off the single-message fast path. This caps how wide/tall the per-role
      layouts (xegpu_distinct_layout_per_access_role) may set inst_data on B580.
    scope: sku_specific

  - id: xegpu_widen_load_inst_data_in_pairs
    name: Widening load inst_data pays only when ALL loads feeding one DPAS chain are widened together — one-sided widening REGRESSES
    severity: high
    stage: memory_access
    applies_to: [any_multi_operand_dpas_chain, inst_data_tuning, register_pressure_tradeoffs, gemm, matmul, attention]
    precondition: |
      APPLIES whenever you are about to change inst_data on a load_nd that feeds an
      xegpu.dpas. Enumerate EVERY load feeding that DPAS chain first (both operands of
      each dpas, and every dpas in a fused chain) — the widening must be one atomic
      edit across all of them, and its verdict must be measured only in that form.
      Re-measure from scratch after any change to accumulator dtype or register
      pressure: the sign of this rewrite depends on the GRF budget, so a previous
      verdict does not carry forward.
    description: |
      xegpu_distinct_layout_per_access_role says the LOAD role wants the widest
      2D-block message. That is right, but it is NOT a per-load decision you can
      apply greedily to one operand at a time. inst_data is simultaneously the
      hardware message shape AND the register block the DPAS consumes. Widen the
      load feeding operand A but not operand B and the mismatch inserts a relayout
      that costs MORE than the load messages you saved, so a correct, legal, wider
      load measures SLOWER in isolation. Propose an inst_data widening as ONE atomic
      edit covering every load that feeds the same DPAS chain, and never accept or
      reject the direction on a one-sided measurement.

      SECOND GOVERNOR — it is not monotone in kernel structure. Wide loads trade
      message count against register pressure, so once the loop's live state grows
      (a promoted f32 accumulator, an added prefetch buffer) the same widening turns
      negative: the wider live load blocks now compete for GRF the accumulator needs
      (see xegpu_sink_large_load_to_dpas, xegpu_grf_budget_loop_accumulators).

      THIRD GOVERNOR — do NOT port a wide layout across layout IDIOMS to get there. A
      kernel whose layouts live in the !xegpu.tensor_desc TYPE can express things a
      kernel whose layouts are op ATTRIBUTES cannot; transplanting the former's
      layouts into the latter both regresses and can fail to lower outright
      (XeGPUPropagateLayout asserts the DPAS B operand needs an anchor layout carrying
      inst_data).

      MEASURED INSTANCE — BMG B580, 4k flash attention (median-of-100, large-GRF, all
      ALLCLOSE TRUE), starting from an f16 kernel at 1.4119 ms:
        * K/V inst_data [16,16] -> [32,32] ALONE      -> 1.5888 ms (0.888x, WORSE)
        * Q   inst_data [8,16]  -> [16,32] ALONE      -> 1.3957 ms (1.012x, ~noise)
        * BOTH widened together                       -> 1.1410 ms (1.237x)
      The pair is worth 1.237x; each half alone is worthless or harmful. On top of an
      f32 accumulator (xegpu_f32_accumulator_softmax_recipe, ~32 KB/WG) the SAME paired
      widening goes negative: 1.0352 -> 1.0759 ms (0.962x). And the cross-idiom
      transplant (a hand-tuned reference using sg_layout=[1,1] sg_data=[64,64] in the
      tensor_desc type, moved onto an attribute-layout kernel) measured 1.6488 ms
      (0.856x).

  - id: xegpu_prefetch_depth_is_tunable
    name: Prefetch depth is a tunable, not a free win — suppress it on compute-bound loops
    severity: warning
    stage: device_specific
    applies_to: [any_streaming_loop_considering_prefetch, compute_bound_loops, cache_resident_operands, short_runtime_kernels, gemm, matmul, attention, softmax]
    precondition: |
      DECISION PROCEDURE — before proposing ANY prefetch, classify the loop:
        1. Is it compute-bound? Count the DPAS/transcendental work per iteration
           against the bytes loaded per iteration. If arithmetic dominates, or the
           tile is small relative to the compute on it, prefetch has no latency to
           hide → depth 0-1.
        2. Is the streamed operand already cache-resident? If MANY workgroups re-read
           the SAME tile (the operand is indexed independently of the WG id, or its
           reuse factor across the grid is high), it is already in L2 and there is no
           DRAM latency left to hide → prefetch adds only overhead.
        3. Is total kernel time below ~50us? Then run-to-run noise exceeds any
           plausible prefetch effect → do not trust a single measurement.
      Only a loop that streams large contiguous tiles over >=3-4 iterations AND
      re-reads little AND is latency-bound is a real prefetch candidate. This is a
      property of the loop's arithmetic-intensity and reuse, not of the workload name.
    description: |
      A prefetch is NOT always beneficial, and there is no automatic cost model
      that decides for you. Intel's production software pipeliner
      (TritonIntelGPU tritonintelgpu-pipeline) exposes prefetch depth ONLY as a
      manual `num-stages` knob (frontend default 2 = one iteration ahead; pass
      default 3 = two ahead) and DISABLES prefetch entirely at num-stages<=1. It
      relies on the autotuner to dial depth down for kernels where prefetch does
      not pay. Encode that judgement here:
        * COMPUTE-BOUND loops (DPAS/matmul-dominated, or where DPAS throughput
          already hides global-load latency) should use depth 0-1. Deeper prefetch
          just adds live tiles and REGRESSES; the systolic array, not memory, is the
          bottleneck. This holds even AFTER the loop has been optimized, which is the
          natural objection ("compute got cheaper, so latency must now be exposed") —
          it did not hold up in measurement.
        * OPERANDS WITH HIGH CROSS-WORKGROUP REUSE are already L2-resident, so there
          is no exposed DRAM latency for a prefetch to hide no matter how deep.
        * MEMORY-LATENCY-BOUND loops that stream large contiguous tiles over many
          (>=3-4) iterations are where deeper prefetch (see
          xegpu_multibuffer_prefetch_pipeline) actually helps.
        * SMALL / SHORT-RUNTIME kernels (total kernel time < ~50us, e.g. a
          1024x512 softmax at ~30us) are dominated by run-to-run timing noise: a
          correct prefetch can measure 1.5x on one sample and 0.7x on the next.
          Do NOT trust a marginal prefetch win here — require a stable median
          across repeats (the verifier now measures median-of-N), and prefer to
          leave prefetch off unless the median clears the noise band decisively.
      Detection trigger: when a memory_access prefetch is proposed on a loop that
      is compute-bound or whose measured runtime is below the noise floor, surface
      this as a warning so the optimizer down-weights / skips it.

      MEASURED INSTANCE — BMG B580, 4k flash attention at 1.6679 ms (exp-quotient
      fold + cached hints + fastmath already applied, i.e. compute already 2.2x
      cheaper than the naive kernel), K+V prefetch on the live descriptors with the
      CORRECT cooperative-disjoint layout (sg_layout=[2,4] sg_data=[32,16]):
        depth 1 -> 1.7317 ms (0.963x)   depth 2 -> 1.7367 ms (0.962x)
        depth 3 -> 1.7419 ms (0.958x)
      Flat in depth and uniformly negative. IT GETS WORSE AS THE KERNEL GETS FASTER:
      repeating the depth-1 measurement on the SAME kernel after the f32 accumulator
      landed (1.38731 ms, no prefetch) gives 1.53353 ms — 0.905x, versus 0.963x at
      1.6679 ms. Cheaper compute does NOT expose latency for prefetch to hide here; the
      extra memory traffic and register pressure just cost a larger share of a smaller
      runtime. Treat "the kernel got faster, so now prefetch will pay" as refuted on
      this kernel class, twice. The same kernel with the REPLICATED
      compute layout on prefetch measures 2.0351 ms (0.819x), so getting the layout
      right (xegpu_dedicated_prefetch_layout) is worth 1.175x of pure overhead
      removal — but it only removes overhead, it never turns prefetch into a win
      here. The reason is case 2 above: all 32 y-blocks of a head re-read the same
      K/V, so those tiles are already L2-resident. On THAT kernel class, do not
      re-litigate prefetch — spend memory_access iterations on cache hints and on
      shortening live ranges instead.

      WHY A REFERENCE KERNEL ON THE SAME WORKLOAD STILL GAINS 1.42x — read this before
      concluding the numbers above are wrong. Three 4k flash-attention kernels, same
      16x4096x64 f16 shapes, same 512 WGs x 128 threads, same L2 residency, all on BMG
      B580 with random input in [-1,1] and large GRF. All THREE prefetches carry a real
      lead, so the lead is not what separates them:
        kernel                                   lead  load_nd/iter   with pf   no pf     gain
        mlir-extensions flash_attention_fwd        3     8            1.19454   1.69577   1.42x
        .._fwd_ov_with_arrray_len_4k               1     3            1.28721   1.29953   1.0096x
        our tuned FA (leaded depth 1)              1     3            1.7317    1.6679    0.963x
      The gain tracks the PER-ITERATION LOAD STRUCTURE, not the lead. flash_attention_fwd
      splits K into 4 slices of 16 and loads them TRANSPOSED (K is column-major), so it
      has 8 load_nd in flight per iteration instead of 3, and transposed block loads are
      slow per byte. That is a lot of exposed latency for a prefetch to hide. The _ov_
      variant is structurally identical to ours — 3 plain load_nd, 2 dpas, 128x64 by
      64x64 — and its ENTIRE prefetch prize is 1%. So on the 3-load_nd attention shape,
      1% is the ceiling, and prefetch overhead exceeds it.
      Not separated by measurement: depth 3 vs depth 1 is confounded with the slicing in
      the first row. But our own kernel measured FLAT in depth (0.963 / 0.962 / 0.958x),
      which argues the slicing and the transpose are what buy the 1.42x, not the depth.
      PRACTICAL RULE: count load_nd per loop iteration. Around 3 plain block loads on a
      re-read operand means the prefetch prize is ~1% and not worth an iteration. Many
      loads per iteration, or transposed loads, is where prefetch pays.
      A lead is still MANDATORY whenever a prefetch is written at all — a zero-lead
      prefetch cannot even reach the 1% (see xegpu_prefetch_must_lead_the_load).

  - id: xegpu_prefetch_must_lead_the_load
    name: A prefetch_nd at the SAME offset as the load_nd it shadows has zero lead and can never help
    severity: critical
    stage: memory_access
    applies_to: [any_loop_with_prefetch_nd, gemm, matmul, attention, flash_attention, softmax]
    precondition: |
      TRIGGER — report issue_type: missing_tma, stage: memory_access, whenever a
      xegpu.prefetch_nd and a xegpu.load_nd on the SAME tensor_desc use the SAME
      offset operands. Pure structural check, no measurement needed: compare the two
      offset lists token for token. If they match, the lead is ZERO and the prefetch
      is dead weight. Report it even when the prefetch layout is already correct.
      Zero lead is the single most common way an LLM-written prefetch fails.
    description: |
      A prefetch pays ONLY if its offset is AHEAD of the consuming load's offset by a
      positive whole number of loop steps. `prefetch_nd %t[%i]` immediately followed by
      `load_nd %t[%i]` warms nothing: the two messages target the same address and
      issue back to back, so the load's own cache miss is already in flight before the
      prefetched line can arrive. All you bought is one extra memory message.

      WHY IT SLIPS THROUGH EVERY EXISTING CHECK — this is why it must be caught here:
        * DCE keeps it. `xegpu.prefetch_nd` has no result, so it is not dead code.
        * It lowers cleanly, so no compile error flags it.
        * The verifier's no-op detector cannot flag it either, because the lowered IR
          genuinely DIFFERS: there is one more `load_block2d` with a null destination.
        * It is NOT what xegpu_no_dead_prefetch_reads covers. That constraint is about
          an unused `load_nd`/`transfer_read` RESULT. This one is a real prefetch op
          with a real effect on the memory pipeline and a useless address.
      So a zero-lead prefetch measures as a wash or a small loss, banks as "applied",
      and nothing in the pipeline says why. Check the offsets, not the op count.

      THE FIX — see xegpu_add_prefetch_nd for the full recipe. For depth N: emit N
      prefetches in the loop PROLOGUE at base+0 ... base+(N-1)*step, then inside the
      loop prefetch at `k + N*step` while the load stays at `k`. Clamp the lead
      (`arith.minsi` against the last valid offset) or leave boundary_check at its
      default `true` so the tail iterations do not read past the tensor.

      MEASURED — BMG B580, 4k flash attention, large GRF, random input in [-1,1],
      median of 500 runs, variants interleaved (spread < 0.15%). A pipeline-generated
      kernel emitted 3 prefetch_nd, every one at the load's own offset (zero lead):
        3 zero-lead prefetches (Q compute layout, K/V dedicated layout) -> 1.40982 ms
        all 3 deleted                                                   -> 1.38642 ms  (1.017x FASTER)
        only the Q one deleted                                          -> 1.38648 ms  (1.017x FASTER)
      So the two dedicated-layout zero-lead prefetches are an EXACT no-op (0.004%,
      inside noise) and the single compute-layout one costs the whole 1.7%. The stage
      reported this edit as a 1.025x win; re-timed, it is 0.983x. In-pipeline the same
      zero-lead edit with the compute layout measured 1.12x and 1.14x SLOWER.

      THE FIX IS A LEAD **OR** DELETION — and on a cache-resident stream it is DELETION.
      Do not read this constraint as "always add a lead". Same kernel as above, same
      conditions, three variants measured head to head:
        no prefetch at all                                     -> 1.38731 ms   1.000x
        3 zero-lead prefetches (what the pipeline wrote)        -> 1.40982 ms   0.983x
        correct leaded depth-1, dedicated layout, clamped tail  -> 1.53353 ms   0.905x
      Adding the correct lead made it WORSE than leaving the broken prefetch in, by
      10.5%. That is not a contradiction: a zero-lead prefetch is cheap precisely
      because it re-requests a line already in flight, while a leaded one issues real
      new memory traffic that competes with the loads it is supposed to help. So when
      you find a zero-lead prefetch, the correct edit is to DELETE it unless
      xegpu_prefetch_depth_is_tunable says the stream can profit. Deleting all three
      was worth 1.017x here.

      A LEAD IS NECESSARY, NOT SUFFICIENT. Getting the lead right only makes the
      prefetch CAPABLE of helping. Whether it DOES help is a property of the loop:
      xegpu_prefetch_depth_is_tunable records correctly-leaded depth 1/2/3 prefetches
      on this flash-attention kernel family measuring 0.905-0.963x, because the K/V
      tiles are already L2-resident. Read both: this constraint rejects a broken edit,
      that one rejects an unprofitable one.

  - id: xegpu_wg_loadnd_transpose_supported
    name: "The transpose attribute on xegpu.load_nd now works at WG level, but it is NOT a speed win and only a square subgroup tile is accepted"
    severity: warning
    description: |
      `transpose = array<i64: 1, 0>` on an `xegpu.load_nd` is CORRECT at workgroup
      level as of the 2026-09-11 fix. It used to be dropped silently. It is no
      longer a correctness trap. Two things still matter, though.

      1. IT IS NOT A SPEED WIN. Measured on 4k flash attention, random [-1,1],
         median of 500 runs: the folded transpose runs at 1.14431 ms and the
         explicit `vector.transpose` at 1.14582 ms. That is a 0.1% difference —
         inside the noise floor. The hardware does the transpose either way; the
         fold only moves where it happens. Do NOT spend optimizer iterations on
         this swap expecting a win, in either direction.

         The old KB entry advertised 1.089x for removing the transpose. That
         number was real but it measured a BROKEN kernel doing less work. The
         wrong answer ran at 1.03542 ms. Any measured win from removing a
         transpose is still a correctness red flag — re-validate on random input.

      2. THE SUPPORTED SHAPE IS NARROW, and exceeding it is now a HARD BUILD
         FAILURE (`failed to legalize operation 'xegpu.load_nd'`), not a wrong
         answer. Workgroup distribution accepts a transposed load_nd only when:
           - there is exactly ONE tile per subgroup (no round-robin over tiles),
             because the tiles are enumerated in descriptor order but consumed in
             permuted order, and
           - the subgroup tile is SQUARE, e.g. sg_data = [64, 64]. A non-square
             sg_data such as [32, 16] is rejected.
         Also, `packed` on a workgroup-level load_nd is rejected outright. It
         reshapes the result, which the subgroup type converter cannot express.

      REQUIRES the fixed toolchain. The fix is three separate edits in
      llvm-project, on branch `xegpu-load-transpose-fix`:
        - XeGPUWgToSgDistribute.cpp — forward the attribute; reject the cases above
        - XeGPUSgToLaneDistribute.cpp — do not add `packed` on top of a transpose
        - XeGPUUnroll.cpp — permute the tile grid between split and reassembly
      Against an older build the attribute is dropped and the kernel is silently
      wrong. Verify with a random-input run, not a constant fill.

      WHY A CONSTANT FILL CANNOT VALIDATE THIS. With Q=K=V=0.625 every QK dot is
      64*0.625^2 = 25.0, so S is constant, the row-max subtraction gives zeros,
      exp(0)=1, P is a uniform 1/4096 and O is 0.625 everywhere. A missing
      transpose, a wrong reduction axis or a row permutation ALL pass
      [ALLCLOSE: TRUE]. A square 64x64 K tile also means a missing transpose
      changes NO type, so the verifier stays quiet. On random [-1,1] the broken
      kernel showed max abs error 0.0219, about 100x above f16 drift (~3e-4);
      the fixed kernel shows 1.5486e-05 against an f32 reference.
    stage: any

  - id: xegpu_sink_large_load_to_dpas
    name: Do not hoist a large (>~32KB) operand load far from its DPAS — keep its live range short
    severity: warning
    stage: device_specific
    description: |
      Counter-rule to xegpu_hoist_invariant_loads. A large 2-D operand kept live
      across a long span occupies GRF for that whole span, cutting occupancy and
      risking spills. Intel's ReduceVariableLiveness moves/clones such a load down
      next to its DPAS consumer when the block's live-in tensor bytes exceed
      ~32 KB AND the tensor is large (>= 128x128 x 2B = 32 KB, minor dim >= 128).
      So: hoisting loop-invariant address math and SMALL descriptors out of the
      loop is good (xegpu_hoist_invariant_loads), but do NOT hoist a LARGE
      xegpu.load_nd (>~32 KB of live registers) far above the xegpu.dpas that
      consumes it — keep or duplicate the load adjacent to the DPAS to shorten its
      register live range. This GRF-pressure governor bounds how aggressive
      hoisting and prefetch depth may be (see xegpu_grf_budget_loop_accumulators,
      xegpu_prefetch_depth_is_tunable).

  - id: xegpu_distinct_layout_per_access_role
    name: Pick #xegpu.layout independently for compute (DPAS), prefetch, and load — reusing one role's layout for another usually regresses
    severity: high
    stage: memory_access
    description: |
      Every xegpu access (dpas operand, load_nd, prefetch_nd) carries a
      #xegpu.layout (sg_layout / sg_data / inst_data) that decides how the 2D tile is
      distributed across the workgroup's subgroups. The OPTIMAL distribution is
      DIFFERENT for each access role. Xe-Forge should treat these as THREE separate
      layout decisions and search a role-specific layout for each, rather than
      copy-pasting one layout onto all of them (the common, lazy mistake). In most
      kernels the three want genuinely different layouts:
        * COMPUTE (xegpu.dpas operands): sg_data / inst_data must match the DPAS
          register shape (BMG DPAS [8,16]/[16,16]) so operands feed the systolic
          array with NO relayout. This layout is dictated by the DPAS, not by memory.
        * LOAD (xegpu.load_nd that feeds a DPAS): wants the WIDEST contiguous 2D-block
          message that still lands in the DPAS register shape (e.g. inst_data=[16,32]
          or [32,32]) — fewer, wider load messages, then a cheap in-register reshape.
        * PREFETCH (xegpu.prefetch_nd): its ONLY job is to pull the tile into
          L1/L2/L3 once; it never feeds a register. The right layout is a DEDICATED,
          WIDE, COOPERATIVE-DISJOINT spread where the subgroups TOGETHER cover the
          tile exactly once, i.e. sg_layout .* sg_data == tile shape.
      Concrete failure this prevents (measured on BMG, 64x64 f16 K/V tile, median-of-3):
      reusing the COMPUTE layout sg_layout=[8,1] sg_data=[64,64] on the prefetch makes
      each of the 8 subgroups prefetch the FULL 64x64 tile -> 8x redundant prefetch
      traffic + cache thrash -> 0.85x (a 1.17x SLOWDOWN). Switching ONLY that prefetch
      to a dedicated wide sg_layout=[2,4] sg_data=[32,16] (2*32 x 4*16 == 64x64, every
      byte fetched exactly once) removes the redundancy -> 1.02x break-even, and 1.20x
      faster than the compute-layout prefetch. Nothing else in the kernel changed.
      Detection trigger: when a prefetch_nd or a load_nd carries the SAME
      #xegpu.layout as a dpas operand (or when all three roles share one layout),
      surface this so the optimizer proposes a role-specific layout. See
      xegpu_multibuffer_prefetch_pipeline (dedicated wide prefetch layout) and
      xegpu_fold_transpose_into_nd_tdesc (load-orientation layout) for the concrete
      per-role forms; xegpu_dedicated_prefetch_layout below is the direct fix.

patterns:
  - id: xegpu_add_prefetch_nd
    name: Prefetch operand tiles ahead of the streaming loop with cache hints
    stage: memory_access
    precondition: |
      FIRST check xegpu_prefetch_depth_is_tunable: on a compute-bound loop, or one
      whose operand is already cache-resident from cross-workgroup reuse, a correct
      prefetch is a measured REGRESSION. Only proceed if that classification says the
      stream is latency-bound.

      Then, APPLIES ONLY when the kernel body already contains xegpu.load_nd on an
      xegpu.tensor_desc created by xegpu.create_nd_tdesc (i.e. the kernel is
      ALREADY in xegpu block-load form — typically a GEMM/MLP lowered by the
      matmul path). It does NOT apply to a vector-dialect kernel whose loads are
      vector.transfer_read: those may lower to xegpu.load GATHERS (index-vector
      loads), which have no tensor_desc to prefetch, and there is no xegpu.load_nd
      in the IR to attach a prefetch to. Do NOT fabricate a prefetch by adding a
      vector.transfer_read whose result is unused — it is dead code that the
      compiler's DCE deletes, so the lowered IR is byte-identical and the
      "optimization" is a verified no-op (see constraint
      xegpu_no_dead_prefetch_reads). If a vector-dialect kernel is memory-bound,
      the real fix is upstream: make its transfer_reads lower to contiguous
      load_nd block loads (a layout/contiguity change), THEN this pattern applies.
    description: |
      Insert xegpu.prefetch_nd for a LATER K-iteration's tile before the load_nd that
      consumes the CURRENT tile, with l1_hint/l2_hint/l3_hint =
      #xegpu.cache_hint<cached>. This overlaps global memory latency with DPAS compute.
      Use a dedicated prefetch layout (#k_prefetch) whose sg_layout spreads the
      prefetch across subgroups (xegpu_dedicated_prefetch_layout).

      THE LEAD IS THE WHOLE POINT. A prefetch at the load's own offset is dead weight —
      see xegpu_prefetch_must_lead_the_load. Depth-N recipe, and emit BOTH halves:
        1. PROLOGUE, before the loop: N prefetches at base+0, base+1*step, ...,
           base+(N-1)*step. Without these, the first N iterations are unprefetched.
        2. IN-LOOP: prefetch at `k + N*step` while the load stays at `k`.
      Depth 1 is the safe default. Deeper only helps a long DRAM-latency-bound stream,
      and costs more in-flight cache lines.

      THE TAIL MUST NOT READ PAST THE TENSOR. Pick one of two idioms; both are used by
      working reference kernels and they are NOT interchangeable:
        * IDIOM A — one descriptor over the WHOLE tensor, vary the OFFSET operand.
          Leave `boundary_check` at its default, which is `true` (verified:
          mlir/include/mlir/Dialect/XeGPU/IR/XeGPUAttrs.td, `CArg<"bool", "true">:
          $boundary_check`), so the hardware clamps the last N iterations. Or clamp
          yourself with `arith.minsi` against the last valid offset.
          Used by mlir-extensions flash_attention_fwd.mlir at depth 3.
        * IDIOM B — recompute a RAW POINTER each iteration and build a fresh tdesc at
          it, offset always [0, 0]. Here you MUST clamp the pointer arithmetic, because
          this idiom is normally paired with `block_tdesc_attr<boundary_check = false>`.
          Used by mlir-extensions flash_attention_fwd_ov_with_arrray_len_4k.mlir at depth 1.
      Do not mix them: a fresh-pointer tdesc with a nonzero offset double-counts the
      lead, and a whole-tensor descriptor with offset [0,0] has no lead at all.
    rationale: |
      The DPAS array stalls waiting on global loads; software prefetch into the
      cache hierarchy hides that latency behind compute. It can only do so if the line
      is requested far enough ahead that it has arrived by the time the load issues.
    pattern_before: |
      scf.for %k = %c0 to %K step %BLOCK_K iter_args(%acc = %zero) -> (vector<128x16xf32>) {
        %a = xegpu.load_nd %a_tile[%row, %k] : !xegpu.tensor_desc<128x64xf16, #a> -> vector<128x64xf16>
        %b = xegpu.load_nd %b_tile[%k, %col] : !xegpu.tensor_desc<64x16xf16, #b>  -> vector<64x16xf16>
        %acc2 = xegpu.dpas %a, %b, %acc : vector<128x64xf16>, vector<64x16xf16>, vector<128x16xf32> -> vector<128x16xf32>
        scf.yield %acc2 : vector<128x16xf32>
      }
    pattern_after: |
      // Depth 1, idiom A: one descriptor over the whole B tensor, offset operand varies.
      // %k_pf carries the DEDICATED prefetch layout, not #b.
      %k_pf = xegpu.create_nd_tdesc %B_ptr, ... -> !xegpu.tensor_desc<64x64xf16, #k_prefetch>
      %last_k = arith.subi %K, %BLOCK_K : index                       // last in-bounds offset
      // (1) prologue: depth 1 => one prefetch, at the base offset the loop starts on
      xegpu.prefetch_nd %k_pf[%c0, %col] {l1_hint = #xegpu.cache_hint<cached>, l2_hint = #xegpu.cache_hint<cached>, l3_hint = #xegpu.cache_hint<cached>, layout = #k_prefetch} : !xegpu.tensor_desc<64x64xf16, #k_prefetch>
      scf.for %k = %c0 to %K step %BLOCK_K iter_args(%acc = %zero) -> (vector<128x16xf32>) {
        // (2) in-loop: LEAD by 1 step. The load below uses %k; this must NOT.
        %knext = arith.addi %k, %BLOCK_K : index
        %knext_ok = arith.minsi %knext, %last_k : index               // clamp the tail
        xegpu.prefetch_nd %k_pf[%knext_ok, %col] {l1_hint = #xegpu.cache_hint<cached>, l2_hint = #xegpu.cache_hint<cached>, l3_hint = #xegpu.cache_hint<cached>, layout = #k_prefetch} : !xegpu.tensor_desc<64x64xf16, #k_prefetch>
        %a = xegpu.load_nd %a_tile[%row, %k] {l1_hint = #xegpu.cache_hint<cached>, l2_hint = #xegpu.cache_hint<cached>} : !xegpu.tensor_desc<128x64xf16, #a> -> vector<128x64xf16>
        %b = xegpu.load_nd %b_tile[%k, %col] {l1_hint = #xegpu.cache_hint<cached>, l2_hint = #xegpu.cache_hint<cached>} : !xegpu.tensor_desc<64x16xf16, #b> -> vector<64x16xf16>
        %acc2 = xegpu.dpas %a, %b, %acc : vector<128x64xf16>, vector<64x16xf16>, vector<128x16xf32> -> vector<128x16xf32>
        scf.yield %acc2 : vector<128x16xf32>
      }
    expected_speedup: "1.3-2x on a DRAM-latency-bound GEMM / attention stream. 1.0x (or slightly worse) if the streamed operand is already L2-resident — classify with xegpu_prefetch_depth_is_tunable first."
    applies_to: ["gemm", "matmul", "flash_attention"]

  - id: xegpu_dedicated_prefetch_layout
    name: Give prefetch_nd its own cooperative-disjoint wide layout, not the DPAS/load layout
    stage: memory_access
    precondition: |
      APPLIES when a xegpu.prefetch_nd carries the SAME #xegpu.layout as the DPAS
      operand or the load_nd it shadows (a common LLM mistake: copy the compute/load
      layout onto the prefetch). Requires the kernel already in load_nd / prefetch_nd
      block form. This is the memory_access-stage instance of the general rule
      xegpu_distinct_layout_per_access_role.
    description: |
      Replace the reused compute/load layout on prefetch_nd with a DEDICATED layout
      whose sg_layout .* sg_data EQUALS the prefetched tile shape, so the workgroup's
      subgroups partition the tile disjointly and fetch every byte exactly once. A
      compute layout that assigns each subgroup the FULL tile (sg_data == tile shape)
      makes every subgroup redundantly prefetch the whole tile — multiplying prefetch
      traffic by the subgroup count. The prefetch layout is chosen for cache coverage,
      NOT to match any register/DPAS shape.

      THE LAYOUT IS ONLY HALF THE EDIT. Fixing the layout on a prefetch whose offset
      equals the load's offset just makes a zero-lead prefetch cheaper — measured an
      EXACT no-op (0.004%) rather than a win. The offsets below are written out in full
      for that reason: the prefetch offset MUST be the load offset plus a whole number
      of loop steps. See xegpu_prefetch_must_lead_the_load, and
      xegpu_prefetch_depth_is_tunable for whether the loop can profit at all.
    rationale: |
      Prefetch only needs the tile resident in cache; the cheapest way is one
      cooperative pass across the subgroups. Reusing the DPAS/load layout
      (sg_data == full tile) multiplies prefetch traffic by the subgroup count and
      thrashes the cache — a measured 1.17x slowdown that a dedicated wide layout
      turns back into a break-even / positive result.
    pattern_before: |
      // WRONG on TWO counts, both visible in this one op:
      //   1. layout reused from compute/load -> each of the 8 SGs fetches the whole 64x64 tile (8x traffic)
      //   2. offset %k is the SAME offset the load_nd below uses -> zero lead, warms nothing
      scf.for %k = %c0 to %c4096 step %c64 iter_args(%acc = %zero) -> (vector<128x64xf32>) {
        xegpu.prefetch_nd %k_pf[%k, %c0]
          <{layout = #xegpu.layout<sg_layout = [8, 1], sg_data = [64, 64], inst_data = [16, 16]>,
            l1_hint = #xegpu.cache_hint<cached>, l2_hint = #xegpu.cache_hint<cached>, l3_hint = #xegpu.cache_hint<cached>}>
          : !xegpu.tensor_desc<64x64xf16, #xegpu.block_tdesc_attr<boundary_check = false>>
        %kv = xegpu.load_nd %k_tile[%k, %c0] {...} : !xegpu.tensor_desc<64x64xf16, ...> -> vector<64x64xf16>
        ...
      }
    pattern_after: |
      // RIGHT on both counts:
      //   1. dedicated wide layout -> 8 SGs cover 64x64 disjointly (2*32 x 4*16 == 64x64), each byte once
      //   2. offset leads the load by one step (%k + 64), clamped so the last iteration stays in bounds
      xegpu.prefetch_nd %k_pf[%c0, %c0] <{layout = #pf, l1_hint = ..., l2_hint = ..., l3_hint = ...}> : ...   // prologue: warm iteration 0
      scf.for %k = %c0 to %c4096 step %c64 iter_args(%acc = %zero) -> (vector<128x64xf32>) {
        %lead = arith.addi %k, %c64 : index
        %lead_ok = arith.minsi %lead, %c4032 : index          // 4096 - 64: never read past the tensor
        xegpu.prefetch_nd %k_pf[%lead_ok, %c0]
          <{layout = #xegpu.layout<sg_layout = [2, 4], sg_data = [32, 16], inst_data = [32, 16]>,
            l1_hint = #xegpu.cache_hint<cached>, l2_hint = #xegpu.cache_hint<cached>, l3_hint = #xegpu.cache_hint<cached>}>
          : !xegpu.tensor_desc<64x64xf16, #xegpu.block_tdesc_attr<boundary_check = false>>
        %kv = xegpu.load_nd %k_tile[%k, %c0] {...} : !xegpu.tensor_desc<64x64xf16, ...> -> vector<64x64xf16>
        ...
      }
    expected_speedup: "removes an 8x-redundant-prefetch regression: ~1.2x vs a compute-layout prefetch (0.85x -> 1.02x on a BMG 64x64 K/V tile). With a zero-lead offset that is where it stops: 1.02x means break-even, not a win."
    applies_to: ["flash_attention", "gemm", "matmul", "softmax"]

  - id: xegpu_cache_hint_on_load
    name: Add cached l1/l2/l3 hints to load_nd of reused operands
    stage: memory_access
    description: |
      Operands reused across the workgroup (e.g. a shared B panel) should be
      loaded with #xegpu.cache_hint<cached> so they stay resident in L1/L2
      rather than streaming through.
    rationale: |
      Cache hints keep hot operands in the cache hierarchy, cutting redundant
      global traffic when many subgroups read overlapping data.
    pattern_before: |
      %b = xegpu.load_nd %b_tile[%k, %col] : !xegpu.tensor_desc<64x16xf16, #b> -> vector<64x16xf16>
    pattern_after: |
      %b = xegpu.load_nd %b_tile[%k, %col] {l1_hint = #xegpu.cache_hint<cached>, l2_hint = #xegpu.cache_hint<cached>, l3_hint = #xegpu.cache_hint<cached>} : !xegpu.tensor_desc<64x16xf16, #b> -> vector<64x16xf16>
    expected_speedup: "1.1-1.4x on bandwidth-bound kernels"
    applies_to: ["gemm", "matmul", "flash_attention"]

  - id: xegpu_hoist_invariant_loads
    name: Hoist K-loop-invariant loads and address math out of the loop
    stage: memory_access
    description: |
      Tile descriptors and offsets that do not depend on the K induction
      variable should be created once before the scf.for, not rebuilt each
      iteration.
    rationale: |
      Recomputing create_nd_tdesc / offsets every iteration wastes issue slots
      and can block prefetch overlap.
    pattern_before: |
      scf.for %k = %c0 to %K step %BLOCK_K {
        %a_tile = xegpu.create_nd_tdesc %A_ptr, shape: [%M, %K], strides: [%K, %c1] : i64 -> !xegpu.tensor_desc<128x64xf16, #a>
        %a = xegpu.load_nd %a_tile[%row, %k] : !xegpu.tensor_desc<128x64xf16, #a> -> vector<128x64xf16>
        ...
      }
    pattern_after: |
      %a_tile = xegpu.create_nd_tdesc %A_ptr, shape: [%M, %K], strides: [%K, %c1] : i64 -> !xegpu.tensor_desc<128x64xf16, #a>
      scf.for %k = %c0 to %K step %BLOCK_K {
        %a = xegpu.load_nd %a_tile[%row, %k] : !xegpu.tensor_desc<128x64xf16, #a> -> vector<128x64xf16>
        ...
      }
    expected_speedup: "1.05-1.2x"
    applies_to: ["gemm", "matmul", "flash_attention"]

  - id: xegpu_fold_transpose_into_nd_tdesc
    name: Fold a transpose into the 2D block load (stride/shape swap) instead of materializing it
    stage: memory_access
    precondition: |
      CORRECT but NOT A WIN at workgroup level. Read
      xegpu_wg_loadnd_transpose_supported before applying it.

      The fold was silently wrong until the 2026-09-11 fix. It is correct now, on
      a toolchain that carries that fix. But it does not buy speed: measured on 4k
      flash attention, random [-1,1], median of 500 runs, the folded transpose is
      1.14431 ms and the explicit `vector.transpose` is 1.14582 ms. That is 0.1%,
      inside the noise floor. Do not spend iterations on the swap.

      Two hard limits, both now a build failure rather than a wrong answer:
        - exactly ONE tile per subgroup, and
        - a SQUARE subgroup tile (sg_data = [64, 64] is fine, [32, 16] is not).
      `packed` on a WG-level load_nd is rejected outright.

      It was distilled from Intel's Triton passes OptimizeDotOperands /
      FuseTransWithLoad, which operate on Triton `make_tensor_ptr`. That is a
      different compiler path. The technique was ported to the XeGPU KB before
      anyone checked that the XeGPU WG pipeline honoured the attribute; for a
      year it did not.
    description: |
      Correct at WG level, but worth ~0% — read the precondition first.

      The idea: instead of materializing dot(a, trans(load(ptr))) as a separate
      vector.transpose on loaded registers, bake the transpose into the descriptor.
      Create the xegpu.create_nd_tdesc over the TRANSPOSED view of the operand
      (swap the two shape entries and the two stride entries) and use
      xegpu.load_nd's transpose capability so the hardware 2D block read performs
      the transpose for free.

      Why the "free" transpose is not free: on Xe2 a sub-32-bit transposed block
      read is done at 32-bit granularity, so an f16 transpose still costs a real
      pass over the data. The register-level `vector.transpose` and the folded
      form end up doing the same work. Verified on FA_gpt56_opt.mlir: folded
      1.14431 ms vs explicit 1.14582 ms, and 1.5486e-05 max abs error against an
      f32 reference. Before the fix the same kernel gave 0.0219.
    rationale: |
      A transpose materialized in registers costs shuffles/copies and extra live
      state; the 2D block engine can read the transposed layout directly, so the
      transpose becomes a descriptor attribute rather than executed arithmetic.
    pattern_before: |
      %kt = xegpu.load_nd %k_tile[%off, %c0] : !xegpu.tensor_desc<16x64xf16, #k> -> vector<16x64xf16>
      %k  = vector.transpose %kt, [1, 0] : vector<16x64xf16> to vector<64x16xf16>
      %qk = xegpu.dpas %q, %k, %acc : vector<128x64xf16>, vector<64x16xf16>, vector<128x16xf32> -> vector<128x16xf32>
    pattern_after: |
      // descriptor over the transposed view: shape/strides swapped, transpose on load_nd
      %k_tile_t = xegpu.create_nd_tdesc %K_ptr, shape: [%D, %N], strides: [%c1, %N] : i64 -> !xegpu.tensor_desc<64x16xf16, #kt>
      %k  = xegpu.load_nd %k_tile_t[%c0, %off] <{transpose = array<i64: 1, 0>}> : !xegpu.tensor_desc<64x16xf16, #kt> -> vector<64x16xf16>
      %qk = xegpu.dpas %q, %k, %acc : vector<128x64xf16>, vector<64x16xf16>, vector<128x16xf32> -> vector<128x16xf32>
    expected_speedup: "~1.00x (measured 1.14431 vs 1.14582 ms on 4k flash attention). Correct, but not a performance lever."
    applies_to: ["flash_attention", "gemm", "matmul"]

  - id: xegpu_store_nd_contiguous_128b
    name: Coalesce store_nd so each lane writes a contiguous <=128-bit chunk on the stride-1 axis
    stage: memory_access
    precondition: |
      APPLIES to the epilogue xegpu.store_nd (or any global store) of a WG kernel.
      Do NOT apply to reshape the compute layout of DPAS operands — this is about
      the STORE's per-lane access width and axis only.
    description: |
      Derive the store's access order from pointer contiguity and place the
      contiguous (stride-1) dimension as the vectorized per-thread dimension, so
      the warp-level write has no gaps. Cap each lane's store at 128 bits (the
      widest vector store) along that contiguous axis. Distilled from Intel's
      Coalesce pass, which enforces a 128-bit / no-gap rule specifically for
      non-load (store) ops (loads tolerate wider strided access because L1 hides
      the gaps; stores do not). Align sg_data to the contiguous axis so the store
      tile is dense.
    rationale: |
      A strided/gapped store issues multiple partial-cacheline writes per warp,
      wasting write bandwidth; a contiguous <=128-bit-per-lane store fills whole
      cachelines with one message.
    pattern_before: |
      // sg_data / layout puts the strided (non-unit) dim as the per-lane vector dim -> gapped store
      xegpu.store_nd %out, %o_tile[%row, %col] <{layout = #xegpu.layout<sg_layout=[1,8], sg_data=[64,2]>}> : vector<64x16xf32>, !xegpu.tensor_desc<64x16xf32, #o>
    pattern_after: |
      // contiguous inner dim (stride 1) is the per-lane vector dim, <=128-bit chunk
      xegpu.store_nd %out, %o_tile[%row, %col] <{layout = #xegpu.layout<sg_layout=[8,1], sg_data=[8,16]>}> : vector<64x16xf32>, !xegpu.tensor_desc<64x16xf32, #o>
    expected_speedup: "1.05-1.3x on store-bandwidth-bound kernels (elementwise / softmax epilogues)"
    applies_to: ["softmax", "elementwise", "gemm", "flash_attention"]

  - id: xegpu_multibuffer_prefetch_pipeline
    name: "Software-pipelined multi-buffered xegpu.prefetch_nd (prefetch N tiles ahead, dedicated layout, no branch)"
    stage: memory_access
    scope: sku_specific
    skus: [bmg, pvc, arc_a770]
    tags: [prefetch, multibuffer, software-pipeline, memory_access, latency-hiding, attention]
    applies_to: [any_tile_streaming_loop, latency_bound_loops, gemm, matmul, attention]
    expected_speedup: "1.2-1.7x on a memory-latency-bound tile stream"
    precondition: |
      DECISION PROCEDURE — apply only when ALL hold:
        1. An inner scf.for walks a large operand tile-by-tile with a monotone offset
           (one xegpu.load_nd per iteration at base + k*BLOCK).
        2. That stream is MEMORY-LATENCY bound, and the operand is NOT already
           cache-resident from cross-workgroup reuse. Check this against
           xegpu_prefetch_depth_is_tunable FIRST — on a compute-bound or
           already-L2-resident stream this pattern is a measured regression, not a win.
        3. The loop has enough iterations (>= ~3-4) to fill the pipeline.
      Any operand that streams this way qualifies (a GEMM K-panel, an attention K/V
      stream over the context, a convolution's weight stream); what matters is the
      access shape and the boundedness, not the algorithm.

      Do NOT convert a single per-iteration prefetch guarded by scf.if into this form
      naively: an scf.if-guarded, one-iteration-ahead prefetch on this hardware has
      REGRESSED in practice (branch overhead + too-short lead distance to hide L3/HBM
      latency). The correct form is branch-free with a lead distance of 3 tiles.
      Requires the tensor_desc / hardware to tolerate out-of-bounds prefetch of the
      trailing tiles (prefetch is a hint and must not fault); verify [ALLCLOSE: TRUE]
      is unchanged (prefetch is side-effect-free on results).
    description: |
      Build a depth-3 (triple-buffered) prefetch pipeline for each streamed operand:
        1. PROLOGUE, before the loop: issue 3 prefetch_nd at tile offsets
           base, base+BLOCK_N, base+2*BLOCK_N (fills the pipe 3 tiles deep).
        2. IN-LOOP, at the top of iteration k: issue ONE prefetch_nd at
           base + 3*BLOCK_N + k -- i.e. 3 tiles ahead of the tile being consumed
           this iteration. No scf.if guard.
      Use a SEPARATE prefetch layout that spreads the prefetch across subgroups
      differently from the compute-load layout: e.g. compute load #k = sg_layout=[8,1]
      sg_data=[16,64], but prefetch #k_prefetch = sg_layout=[4,2] sg_data=[16,32]. The
      prefetch layout's job is broad L1/L2/L3 coverage of the 64x64 tile, not feeding
      DPAS, so a 4x2 spread pulls the whole tile with fewer, wider messages. All
      prefetch_nd carry l1/l2/l3 = cached.
    rationale: |
      A one-iteration-ahead prefetch only hides ~1 tile of latency; global-load
      latency on Xe2 spans several tiles, so the load still stalls. Prefetching 3
      tiles ahead keeps 3 outstanding cache-fills in flight, so by the time load_nd
      consumes tile k the line is already resident. Dropping the scf.if removes a
      per-iteration branch on the hot path. A dedicated wide prefetch layout decouples
      "how we cover the tile in cache" from "how DPAS wants the data laid out."
    pattern_before: |
      scf.for %k = %c0 to %N_CTX step %BLOCK_N iter_args(...) {
        // one-iteration-ahead, guarded -- REGRESSES on Xe2
        %next = arith.addi %k, %BLOCK_N : index
        %ok = arith.cmpi slt, %next, %N_CTX : index
        scf.if %ok {
          xegpu.prefetch_nd %k_pf[%wg_x_offset_plus_next, %c0]
            {l1_hint=#xegpu.cache_hint<cached>, ...} : !xegpu.tensor_desc<64x64xf16, #k>
        }
        %kv = xegpu.load_nd %k_tile[%wg_x_offset_plus_k, %c0] ...
        ...
      }
    pattern_after: |
      // dedicated wide prefetch layout
      #k_prefetch = #xegpu.layout<sg_layout=[4,2], sg_data=[16,32], inst_data=[16,16]>
      %k_pf = xegpu.create_nd_tdesc %K, shape:[...], strides:[...]
        : memref<?x?xf16> -> !xegpu.tensor_desc<64x64xf16, #k_prefetch>
      // PROLOGUE: fill the pipe 3 tiles deep
      xegpu.prefetch_nd %k_pf[%base, %c0]              {l1_hint=#xegpu.cache_hint<cached>, ...}
      xegpu.prefetch_nd %k_pf[%base_plus_BLOCK_N, %c0] {l1_hint=#xegpu.cache_hint<cached>, ...}
      xegpu.prefetch_nd %k_pf[%base_plus_2BLOCK_N,%c0] {l1_hint=#xegpu.cache_hint<cached>, ...}
      %BLOCK_N_3 = arith.muli %BLOCK_N, %c3 : index
      scf.for %k = %c0 to %N_CTX step %BLOCK_N iter_args(...) {
        // IN-LOOP: branch-free, 3 tiles ahead
        %ahead = arith.addi %BLOCK_N_3, %k : index
        %off   = arith.addi %base, %ahead : index
        xegpu.prefetch_nd %k_pf[%off, %c0] {l1_hint=#xegpu.cache_hint<cached>, ...}
        %kv = xegpu.load_nd %k_tile[%wg_x_offset_plus_k, %c0] ...
        ...
      }
    notes: |
      Lead distance is a tunable: 3 is the validated value on BMG for a 64-wide tile;
      deeper pipes cost more register/cache residency for marginal latency gain. When
      two operands advance together over the same offset (attention's K and V), issue
      both prefetches at the same running offset rather than pipelining them
      separately. See xegpu_add_prefetch_nd for the base "add a prefetch at all"
      pattern; this is its production-grade multi-buffer form.

      MEASURED INSTANCE — the depth-3 branch-free form is the validated one on BMG for
      a 64-wide tile. On the 4k flash-attention K/V stream, which fails precondition 2
      (already L2-resident), the same correct form measured 0.958-0.963x across depths
      1-3 — see the numbers in xegpu_prefetch_depth_is_tunable. That is the intended
