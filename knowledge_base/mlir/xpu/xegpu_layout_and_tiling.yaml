kb_schema_version: 1
# CONCERN: #xegpu.layout attributes, tile geometry, and the register budget.
#
# How the workgroup tile is split across subgroups (sg_layout / sg_data), how much
# each instruction consumes (inst_data), how large a tile may be held live, and how
# a layout is propagated instead of re-converted. The legality floor for all of
# this — DPAS shape alignment, exact tiling, subgroup count, the large-GRF cap — is
# stated once in mlir/common/xegpu_hardware_contract.yaml; this file is about
# choosing WELL among the legal options.
#
# Grouped by concern rather than by kernel: the register-budget and K-slicing rules
# lived in a "flash_attention_patterns" file, which hid the fact that they apply to
# any loop carrying large tiles. Each entry states its own precondition.
#
# The optimizer edits ONLY the gpu.module kernel body, the #xegpu.layout attributes,
# and the gpu.launch_func grid/block geometry. The @main host harness and its
# embedded CPU reference are the fixed correctness oracle ([ALLCLOSE: TRUE]) and
# must not change.
#
# Hardware: Intel Xe2 (BMG B580/B570/Pro B) and Xe-HPC (PVC). Subgroup (SIMD) width
# is 16; the DPAS/XMX systolic array consumes 2D tiles.
language: mlir
device: xpu
category: optimization

constraints:
  - id: xegpu_sg_layout_matches_launch_threads
    name: sg_layout product must match subgroups-per-workgroup in gpu.launch_func
    severity: critical
    stages: [device_specific, autotuning]
    description: |
      The XeGPU spelling of mlir_subgroup_count_and_grf_budget: in
      #xegpu.layout<sg_layout=[a, b], ...> the product a*b IS the number of
      subgroups per workgroup, so it must equal threads-per-workgroup / 16.

      If gpu.launch_func declares `threads in (%c128, %c1, %c1)` that is
      128 / 16 = 8 subgroups, so sg_layout must satisfy a*b == 8
      (e.g. [8, 1], [4, 2], [2, 4], [1, 8]). A mismatch causes a lowering
      failure or wrong results. Remember the large-GRF cap of 32 subgroups
      applies to this same product.

  - id: xegpu_propagate_dpas_layout_epilogue
    name: Keep the DPAS accumulator layout through the elementwise epilogue — no intermediate relayouts
    severity: warning
    stage: device_specific
    applies_to: [any_dpas_with_elementwise_epilogue, gemm, matmul, attention, softmax, activation]
    description: |
      Redundant layout conversions cost cross-lane shuffles/copies. Anchor the
      #xegpu.layout at the ops that MUST fix it (xegpu.dpas, xegpu.load_nd) and
      propagate that single layout through the whole elementwise epilogue chain —
      whatever it is: bias/scale, sub, math.exp, mul, truncf, an activation — to the
      store, inserting a relayout
      ONLY where a consumer genuinely demands a different layout. Do NOT emit a
      convert_layout / transpose between the DPAS accumulator and its epilogue
      users just to make an op "fit" — reuse the accumulator's layout downstream.
      Distilled from Intel's RemoveLayoutConversions (anchor -> propagate ->
      resolve-conflicts). The full propagation engine is a compiler pass, but the
      actionable rule for the kernel author/LLM is: one layout from DPAS output
      through the whole epilogue to store.

  - id: xegpu_grf_budget_loop_accumulators
    name: "Budget loop-carried live state against the GRF you actually have — the register file is a shared, zero-sum resource"
    severity: warning
    stage: device_specific
    scope: sku_specific
    skus: [bmg, pvc, arc_a770]
    tags: [grf, register-pressure, spill, large-register-file, device_specific, attention]
    applies_to: [any_loop_carried_large_tile, register_pressure_tradeoffs, gemm, matmul, attention, reduction]
    precondition: |
      DECISION PROCEDURE — add up what the scf.for keeps live across iterations:
        * every iter_arg (accumulators, running statistics), by shape x element width
        * every tile hoisted out of the loop and held resident (a reused A operand)
        * every buffer a prefetch/multi-buffer scheme keeps in flight
      Divide by the subgroup count (product of sg_layout) to get per-thread bytes.
      This rule applies as soon as that total is within ~2x of the per-thread register
      file, and it applies to EVERY decision that adds to the total — widening a tile,
      promoting an accumulator to f32, adding a prefetch stage.
      It is workload-independent: a GEMM K-loop accumulator, a resident operand tile
      and an attention (acc, m_i, l_i) triple all draw on the same budget.
    description: |
      The compile-flag half of this is stated once in
      mlir_subgroup_count_and_grf_budget: large-register-file is a correctness-neutral
      flag that doubles per-thread registers to 256 GRF, it is the cheapest thing to
      measure first, and its verdict goes stale once register pressure changes. Do not
      re-derive it here — set it, and re-sweep it LAST.

      What is specific to writing XeGPU IR is that the register file is then a fixed,
      SHARED budget which every other optimization competes for, so its consumers must
      be ranked, not all applied:
        * prefer SLICING an operand and consuming the slices in sequence over holding a
          whole tile resident (see xegpu_kslice_transpose_dpas)
        * treat "add a prefetch buffer" and "promote the accumulator to f32" as
          COMPETING, not stacking: the accumulator promotion is worth more (measured
          1.364x, xegpu_f32_accumulator_softmax_recipe) and once it is in place the
          prefetch on top costs 13% (1.0352 -> 1.1883 ms on 4k FA)
        * remember large-GRF halves the subgroup budget to <=32 per workgroup, so
          buying registers costs parallelism
      If the total does not fit, cut a consumer rather than accepting spills: a spill
      inside the innermost loop converts a register access into memory traffic.

      MEASURED INSTANCE — WG flash attention, 128x64xf32 accumulator (32 KB per WG
      tile) plus a resident 128x64xf16 Q tile and running m_i/l_i vectors: fits at
      256 GRF, does NOT fit at the default 128 GRF, where IGC spills ~8.9 KB with ~282
      spill/fill accesses per loop body and the kernel measures 4.1x worse.
    rationale: |
      Register pressure is the one budget in a WG kernel that every optimization spends
      from, which is why individually-good rewrites stop composing: each extra live tile
      either evicts another or spills. Reasoning about it as a total, per subgroup,
      before applying a register-hungry rewrite is what keeps a 1.36x from turning into
      a 13% loss.
    fix: |
      // 1. set the flag (details: mlir_subgroup_count_and_grf_budget), and re-sweep it
      //    AFTER the IR changes, not before.
      // 2. then pick ONE register-hungry rewrite at a time and re-measure:
      //    slice operands instead of holding tiles resident, and prefer the f32
      //    accumulator over an extra prefetch buffer when they do not both fit.

patterns:
  - id: xegpu_tune_sg_data_for_dpas
    name: Size sg_data / inst_data to feed the DPAS systolic array
    stage: device_specific
    description: |
      The per-subgroup tile (sg_data) and the per-instruction tile (inst_data)
      control how the workgroup tile is distributed and fed to DPAS. inst_data
      should match a DPAS shape; sg_data should be an integer multiple of
      inst_data so each subgroup issues several back-to-back DPAS ops, keeping
      the systolic array busy and amortizing load latency.
    rationale: |
      Tiles that match the DPAS shape avoid partial/under-utilized MMA issues;
      larger sg_data increases arithmetic intensity per load but costs GRF.
    pattern_before: |
      // Tiny per-subgroup tile — under-feeds DPAS, high relative load overhead
      #a = #xegpu.layout<sg_layout = [8, 1], sg_data = [8, 16],  inst_data = [8, 16]>
    pattern_after: |
      // Larger sg_data (multiple of inst_data) — more DPAS issues per load
      #a = #xegpu.layout<sg_layout = [8, 1], sg_data = [32, 16], inst_data = [8, 16]>
    expected_speedup: "1.2-2x on compute-bound GEMM"
    applies_to: ["gemm", "matmul", "flash_attention"]

  - id: xegpu_balance_sg_layout
    name: Balance sg_layout across M and N to improve data reuse
    stage: device_specific
    description: |
      A 1D sg_layout like [8, 1] tiles only along one axis; a 2D layout such as
      [4, 2] or [2, 4] gives each subgroup a squarer tile, improving reuse of
      both A and B operands and reducing redundant global loads. Keep the
      product equal to subgroups-per-workgroup (see constraint).
    rationale: |
      Square-ish subgroup tiles maximize the ratio of DPAS work to bytes loaded.
    pattern_before: |
      #c = #xegpu.layout<sg_layout = [8, 1], sg_data = [32, 64], inst_data = [8, 16]>
    pattern_after: |
      #c = #xegpu.layout<sg_layout = [4, 2], sg_data = [32, 32], inst_data = [8, 16]>
    expected_speedup: "1.1-1.5x when memory-bound on operand reuse"
    applies_to: ["gemm", "matmul"]

  - id: xegpu_sg_tiling_min_duplication
    name: Choose sg_layout to minimize A/B operand duplication; size register block to the 2D-load max
    stage: device_specific
    description: |
      When splitting the DPAS output across subgroups, double subgroups along the
      dimension with the LARGER remaining tile (driven by the DPAS
      repeatCount:executionSize ratio) so that operands A and B are re-loaded /
      broadcast across as few subgroups as possible. Separately, grow the per-lane
      register block (sg_data / inst_data) toward the hardware 2D-load maximum — on
      PVC/BMG that is 32 rows and 64 bytes of columns — to amortize load-message
      overhead by pulling one full 2D block per load. Distilled from Intel's
      AccelerateMatmul (getWarpsPerTile "minimize duplication of A and B";
      repCluster clamped to PVC_2D_LOAD_MAXIMUM 32 rows / 64 bytes). Complements
      xegpu_balance_sg_layout (square tiles for reuse) with a concrete
      duplication-minimizing split rule and the 32-row/64-byte register-block cap.
      The register-block growth half of this rule applies to attention loops too,
      but see xegpu_widen_load_inst_data_in_pairs first: it must be widened on ALL
      loads feeding the same DPAS chain at once (one-sided = 0.888x, the pair =
      1.237x), and it reverses sign once the accumulator is f32.
    rationale: |
      Every subgroup that redundantly holds the same A or B panel wastes both
      global bandwidth and GRF; splitting along the larger-tile axis cuts that
      replication, and filling the 2D-load maximum per message minimizes the number
      of load instructions issued.
    pattern_before: |
      // sg_data smaller than the 2D-load max -> many narrow loads; split axis replicates B
      #c = #xegpu.layout<sg_layout = [1, 8], sg_data = [8, 16], inst_data = [8, 16]>
    pattern_after: |
      // register block toward 32 rows / 64B cols; split along the larger tile dim to cut A/B duplication
      #c = #xegpu.layout<sg_layout = [4, 2], sg_data = [32, 32], inst_data = [8, 16]>
    expected_speedup: "1.1-1.4x on GEMM by cutting redundant operand loads"
    applies_to: ["gemm", "matmul", "flash_attention"]

  - id: xegpu_kslice_transpose_dpas
    name: "A*B^T via row slices of B + in-register vector.transpose + unrolled DPAS"
    stage: device_specific
    scope: sku_specific
    skus: [bmg, pvc, arc_a770]
    tags: [dpas, register-pressure, transpose, unroll, device_specific, attention]
    applies_to: [any_transposed_b_dpas, register_pressure_tradeoffs, gemm, matmul, attention]
    expected_speedup: "1.1-1.3x vs loading the full B tile (fewer spills, better DPAS overlap)"
    precondition: |
      DECISION PROCEDURE — apply when ALL hold:
        1. There is an A*B^T matmul: B arrives row-major in memory but DPAS needs the
           contraction axis on B's rows, so a transpose is required somewhere.
        2. Holding the whole B tile live would push the loop's total live state past
           the register budget (see xegpu_grf_budget_loop_accumulators) — typically
           because A is also resident and an f32 accumulator is loop-carried.
        3. The DPAS has an f32 accumulator and 16-bit A/B inputs (the contract).
      B's row count must be divisible by the slice height (use the DPAS B tile height,
      16 on SIMD16). Do NOT apply if a hardware transposed-load path is available and
      cheaper, or if the whole tile already fits comfortably in registers.
    description: |
      Instead of loading B as one 64x64 tile, load it as 4 slices of 16x64. For each
      slice: xegpu.load_nd -> vector<16x64xf16>, vector.transpose [1,0] ->
      vector<64x16xf16>, then xegpu.dpas %a_value (128x64), %b_slice_t (64x16),
      %zero (128x16) -> vector<128x16xf32>. This yields four 128x16 output partials
      (columns [0:16],[16:32],[32:48],[48:64] of the 128x64 result tile). Interleave
      load(slice i+1) with dpas(slice i) so loads overlap compute. The transpose
      happens in-register because B is stored row-major but DPAS-B wants the
      contraction axis on its rows; encode the transposed layout as order=[0,1].
    rationale: |
      Holding the whole 64x64 B tile plus a 128x64 resident A tile plus a loop-carried
      128x64 f32 accumulator overruns even a 256-GRF budget and forces spills.
      Slicing B into 16-row chunks caps the live B footprint to one 16x64 slice at a
      time; the 4-way unroll keeps 4 independent DPAS in flight for the DPAS pipeline
      while the next slice loads. In-register transpose avoids a separate transposed
      global load. The partials it produces are also a better shape for any subsequent
      row-wise reduction than one wide tile.
    pattern_before: |
      %kT = xegpu.load_nd %k_tile[%off, %c0] ... : ... -> vector<64x64xf16>  // whole tile, heavy
      %qk = xegpu.dpas %q_value, %kT, %zero_128x64 : vector<128x64xf16>, vector<64x64xf16>, vector<128x64xf32> -> vector<128x64xf32>
    pattern_after: |
      // 4 x (load 16x64 slice -> transpose -> dpas -> 128x16 partial)
      %k0t = xegpu.load_nd %k_slice[%off,    %c0] ... -> vector<16x64xf16>
      %k0  = vector.transpose %k0t, [1, 0] : vector<16x64xf16> to vector<64x16xf16>
      %qk0 = xegpu.dpas %q_value, %k0, %zero_128x16 {layout_a=#q, layout_b=#kt, layout_cd=#qk} : vector<128x64xf16>, vector<64x16xf16>, vector<128x16xf32> -> vector<128x16xf32>
      %k1t = xegpu.load_nd %k_slice[%off+16, %c0] ... -> vector<16x64xf16>
      %k1  = vector.transpose %k1t, [1, 0] : vector<16x64xf16> to vector<64x16xf16>
      %qk1 = xegpu.dpas %q_value, %k1, %zero_128x16 {...} -> vector<128x16xf32>
      // ... slices 2, 3 identically -> %qk2, %qk3
    notes: |
      When the matmul feeds a row-wise reduction, the N separate 128x16 partials are
      the natural reduction inputs: a pairwise arith.maximumf/addf tree over the
      partials, then one vector.multi_reduction along dim 1 — cheaper than reducing a
      single 128x64 tile. Pairs with xegpu_truncf_scores_to_f16_for_pv and
      xegpu_f32_accumulator_softmax_recipe.

      MEASURED INSTANCE — the QK^T matmul of a WG flash-attention kernel (Q 128x64f16
      resident, K 64x64f16 per step, 128x64f32 accumulator loop-carried): this is the
      spelling the tuned kernel ships, and the 1.1-1.3x range above is measured against
      loading the full 64x64 K tile there.
