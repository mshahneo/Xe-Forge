# XeGPU Workgroup-Level MLIR Optimization Patterns
# Targets self-contained WG-level XeGPU kernels (the form in
# mlir-extensions/test/Integration/Dialect/XeGPU/WG): a host @main launches a
# gpu.module kernel via gpu.launch_func and checks the result against an
# embedded CPU reference ([ALLCLOSE: TRUE]).
#
# The optimizer edits ONLY the gpu.module kernel body, the #xegpu.layout
# attributes, and the gpu.launch_func grid/block geometry. The @main harness
# and reference are the fixed correctness oracle and must not change.
#
# Hardware focus: Intel Xe2 (Battlemage: B580/B570/Pro B) and Xe-HPC (PVC).
# Subgroup (SIMD) width is 16; the DPAS/XMX systolic array consumes 2D tiles.

constraints:
  - id: xegpu_sg_layout_matches_launch_threads
    name: sg_layout product must match subgroups-per-workgroup in gpu.launch_func
    severity: critical
    stages: [device_specific, autotuning]
    description: |
      The XeGPU spelling of mlir_subgroup_count_and_grf_budget: in
      #xegpu.layout<sg_layout=[a, b], ...> the product a*b IS the number of
      subgroups per workgroup, so it must equal threads-per-workgroup / 16.

      If gpu.launch_func declares `threads in (%c128, %c1, %c1)` that is
      128 / 16 = 8 subgroups, so sg_layout must satisfy a*b == 8
      (e.g. [8, 1], [4, 2], [2, 4], [1, 8]). A mismatch causes a lowering
      failure or wrong results. Remember the large-GRF cap of 32 subgroups
      applies to this same product.

  - id: xegpu_f32_accumulator_softmax_recipe
    name: How to apply the f32 accumulator in a WG attention loop — measured 1.364x, the single largest lever
    severity: critical
    stages: [dtype_fix, algorithmic, device_specific]
    precondition: |
      APPLIES to a WG kernel with an scf.for carrying a DPAS accumulator, especially
      a fused chain where the first DPAS's output feeds a softmax and then a second
      DPAS (attention: QK^T -> softmax -> PV). If the loop-carried accumulator or the
      softmax statistics are 16-bit, this rule applies.
    description: |
      mlir_dpas_operand_dtype_contract says the accumulator must be f32. This is the
      concrete WG recipe, and the measurement that shows it is a PERF lever:

      Measured on BMG B580, 4k flash attention (median-of-100, large-GRF, both
      ALLCLOSE TRUE): all-f16 loop 1.4119 ms -> f32 acc + f32 softmax with
      `arith.truncf` of P to f16 only for the PV DPAS **1.0352 ms = 1.364x faster**
      (4 runs, 0.8% spread), which also BEAT a hand-tuned reference kernel at
      1.0948 ms. Note the f16 version PASSED its ALLCLOSE check — the harness fills
      inputs with a uniform constant, which makes softmax exact — so the correctness
      gate gave no signal at all here. Check the dtypes structurally.

      Apply it as:
        * acc / running-max (m_i) / running-sum (l_i) iter_args in f32
        * the whole softmax chain (scale, max-reduce, sub, exp, sum) in f32
        * ONE `arith.truncf` of P to f16 immediately before the PV DPAS — that
          second DPAS still needs a 16-bit A operand (see the contract)
        * ONE `arith.truncf` in the epilogue before the store
      i.e. exactly two down-casts, both where the hardware forces one.

      Register cost: the f32 accumulator is ~32 KB/WG, so it REQUIRES large-GRF
      (default GRF measured 4.2 ms, 4.1x worse) and it consumes the budget — adding a
      K/V prefetch on top of it costs 13% (1.0352 -> 1.1883). See
      xegpu_grf_budget_loop_accumulators and xegpu_prefetch_depth_is_tunable.

  - id: xegpu_dpas_operand_dtype_promote
    name: Promote DPAS-unsupported operand dtypes to f16/bf16 before the dpas
    severity: high
    stage: dtype_fix
    description: |
      xegpu.dpas does not natively support every dtype combination on BMG (e.g.
      fp8 on non-FP8-capable HW). If the operands are not a natively supported
      pair, insert an explicit up-cast (arith.extf / fptofp) to f16 (or bf16) on
      the operands BEFORE the dpas, rather than letting lowering fail or emit a
      slow FMA fallback. Distilled from Intel's AccelerateMatmul mixed-mode
      handling (decomposeMixedModeDotOp promotes fp8->f16; opsPerChannel upcasts).
      Keep the accumulator f32 (see mlir_dpas_operand_dtype_contract). Contrast with
      xegpu_cast_inputs_to_bf16 (which fixes an all-f64/f32 kernel); this rule
      specifically covers exotic/mixed operand dtypes DPAS can't take directly.

  - id: xegpu_propagate_dpas_layout_epilogue
    name: Keep the DPAS accumulator layout through the elementwise/softmax epilogue — no intermediate relayouts
    severity: warning
    stage: device_specific
    description: |
      Redundant layout conversions cost cross-lane shuffles/copies. Anchor the
      #xegpu.layout at the ops that MUST fix it (xegpu.dpas, xegpu.load_nd) and
      propagate that single layout through the elementwise / softmax epilogue
      chain (scale, sub, math.exp, mul, truncf) to the store, inserting a relayout
      ONLY where a consumer genuinely demands a different layout. Do NOT emit a
      convert_layout / transpose between the DPAS accumulator and its epilogue
      users just to make an op "fit" — reuse the accumulator's layout downstream.
      Distilled from Intel's RemoveLayoutConversions (anchor -> propagate ->
      resolve-conflicts). The full propagation engine is a compiler pass, but the
      actionable rule for the kernel author/LLM is: one layout from DPAS output
      through the whole epilogue to store.

patterns:
  - id: xegpu_tune_sg_data_for_dpas
    name: Size sg_data / inst_data to feed the DPAS systolic array
    stage: device_specific
    description: |
      The per-subgroup tile (sg_data) and the per-instruction tile (inst_data)
      control how the workgroup tile is distributed and fed to DPAS. inst_data
      should match a DPAS shape; sg_data should be an integer multiple of
      inst_data so each subgroup issues several back-to-back DPAS ops, keeping
      the systolic array busy and amortizing load latency.
    rationale: |
      Tiles that match the DPAS shape avoid partial/under-utilized MMA issues;
      larger sg_data increases arithmetic intensity per load but costs GRF.
    pattern_before: |
      // Tiny per-subgroup tile — under-feeds DPAS, high relative load overhead
      #a = #xegpu.layout<sg_layout = [8, 1], sg_data = [8, 16],  inst_data = [8, 16]>
    pattern_after: |
      // Larger sg_data (multiple of inst_data) — more DPAS issues per load
      #a = #xegpu.layout<sg_layout = [8, 1], sg_data = [32, 16], inst_data = [8, 16]>
    expected_speedup: "1.2-2x on compute-bound GEMM"
    applies_to: ["gemm", "matmul", "flash_attention"]

  - id: xegpu_balance_sg_layout
    name: Balance sg_layout across M and N to improve data reuse
    stage: device_specific
    description: |
      A 1D sg_layout like [8, 1] tiles only along one axis; a 2D layout such as
      [4, 2] or [2, 4] gives each subgroup a squarer tile, improving reuse of
      both A and B operands and reducing redundant global loads. Keep the
      product equal to subgroups-per-workgroup (see constraint).
    rationale: |
      Square-ish subgroup tiles maximize the ratio of DPAS work to bytes loaded.
    pattern_before: |
      #c = #xegpu.layout<sg_layout = [8, 1], sg_data = [32, 64], inst_data = [8, 16]>
    pattern_after: |
      #c = #xegpu.layout<sg_layout = [4, 2], sg_data = [32, 32], inst_data = [8, 16]>
    expected_speedup: "1.1-1.5x when memory-bound on operand reuse"
    applies_to: ["gemm", "matmul"]

  - id: xegpu_cast_inputs_to_bf16
    name: Use bf16/f16 DPAS inputs with f32 accumulation
    stage: dtype_fix
    description: |
      Ensure the load_nd tiles feeding xegpu.dpas are f16/bf16 and the
      accumulator vector is f32. Never compute in f64.
    rationale: |
      bf16/f16 are the native DPAS input types; f32 accumulation preserves
      correctness while keeping the matmul on the XMX path.
    pattern_before: |
      %acc = arith.constant dense<0.0> : vector<128x16xf64>
      %c = xegpu.dpas %a, %b, %acc : vector<128x64xf64>, vector<64x16xf64>, vector<128x16xf64> -> vector<128x16xf64>
    pattern_after: |
      %acc = arith.constant dense<0.0> : vector<128x16xf32>
      %c = xegpu.dpas %a, %b, %acc : vector<128x64xf16>, vector<64x16xf16>, vector<128x16xf32> -> vector<128x16xf32>
    expected_speedup: "many-x vs f64; correctness-critical"
    applies_to: ["gemm", "matmul", "flash_attention"]

  - id: xegpu_softmax_reduction_split_intra_lane
    name: Split a row reduction into a register-local partial reduce, THEN one cross-lane reduce
    stage: algorithmic
    precondition: |
      APPLIES to a row-wise reduction (vector.multi_reduction <maximumf>/<add>, or
      an scf.for reduction) over a tile whose layout gives each lane MORE THAN ONE
      element along the reduction axis — i.e. sg_data / inst_data on the reduced
      dim is > 1, so a lane privately owns several of the values being combined.
      This is exactly the softmax max/sum over a vector<64x16xf32> tile. Do NOT
      apply when each lane owns a single element on the reduce axis (nothing to
      pre-reduce) or when the reduction is already two-stage.
    description: |
      A monolithic within-subgroup reduction along an axis is expensive because it
      is all cross-lane shuffles. When a lane owns k>1 elements along the reduce
      axis, FIRST reduce the k elements the lane holds privately in registers (free
      — no cross-lane communication), producing one partial per lane, THEN do a
      SINGLE size-16 cross-lane (and, if needed, cross-warp) reduction over the
      partials. Distilled from Intel's OptimizeReductionLocality 3-step scheme
      (reduce-owned-elements -> relayout-for-locality -> final reduce); the
      enabling condition there is executionSize == threadsPerWarp with the reduce
      axis lane-multi-valued. Translate ONLY the two-stage principle, NOT the
      Triton blocked-encoding reshape mechanics. Optionally choose the softmax
      layout so the reduction axis is lane-local (transpose-for-locality) to make
      the private partial as large as possible.
    rationale: |
      Cross-lane shuffles dominate a naive subgroup reduction. Doing the
      lane-private part in registers first cuts the amount of data that has to go
      through the (expensive) cross-lane tree to one value per lane, so the shuffle
      network runs once over 16 partials instead of over the full tile width.
    pattern_before: |
      // one full-width cross-lane reduction over the whole 64x16 tile
      %m = vector.multi_reduction <maximumf>, %tile, %init [1] : vector<64x16xf32> to vector<64xf32>
    pattern_after: |
      // (conceptual) each lane first folds the elements it owns along dim 1 in
      // registers, then a single cross-lane reduction finishes the row:
      %partial = vector.multi_reduction <maximumf>, %lane_owned, %init [1] : vector<64xNxf32> to vector<64xf32>  // register-local, no shuffle
      %m       = <cross-lane reduce of %partial over the subgroup>            // one size-16 shuffle tree
    expected_speedup: "1.1-1.4x on reduction-bound softmax / row-normalization"
    applies_to: ["softmax", "layernorm", "reduction", "flash_attention"]

  - id: xegpu_sg_tiling_min_duplication
    name: Choose sg_layout to minimize A/B operand duplication; size register block to the 2D-load max
    stage: device_specific
    description: |
      When splitting the DPAS output across subgroups, double subgroups along the
      dimension with the LARGER remaining tile (driven by the DPAS
      repeatCount:executionSize ratio) so that operands A and B are re-loaded /
      broadcast across as few subgroups as possible. Separately, grow the per-lane
      register block (sg_data / inst_data) toward the hardware 2D-load maximum — on
      PVC/BMG that is 32 rows and 64 bytes of columns — to amortize load-message
      overhead by pulling one full 2D block per load. Distilled from Intel's
      AccelerateMatmul (getWarpsPerTile "minimize duplication of A and B";
      repCluster clamped to PVC_2D_LOAD_MAXIMUM 32 rows / 64 bytes). Complements
      xegpu_balance_sg_layout (square tiles for reuse) with a concrete
      duplication-minimizing split rule and the 32-row/64-byte register-block cap.
      The register-block growth half of this rule applies to attention loops too,
      but see xegpu_widen_load_inst_data_in_pairs first: it must be widened on ALL
      loads feeding the same DPAS chain at once (one-sided = 0.888x, the pair =
      1.237x), and it reverses sign once the accumulator is f32.
    rationale: |
      Every subgroup that redundantly holds the same A or B panel wastes both
      global bandwidth and GRF; splitting along the larger-tile axis cuts that
      replication, and filling the 2D-load maximum per message minimizes the number
      of load instructions issued.
    pattern_before: |
      // sg_data smaller than the 2D-load max -> many narrow loads; split axis replicates B
      #c = #xegpu.layout<sg_layout = [1, 8], sg_data = [8, 16], inst_data = [8, 16]>
    pattern_after: |
      // register block toward 32 rows / 64B cols; split along the larger tile dim to cut A/B duplication
      #c = #xegpu.layout<sg_layout = [4, 2], sg_data = [32, 32], inst_data = [8, 16]>
    expected_speedup: "1.1-1.4x on GEMM by cutting redundant operand loads"
    applies_to: ["gemm", "matmul", "flash_attention"]
