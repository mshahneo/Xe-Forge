kb_schema_version: 1
# WG-level XeGPU flash-attention (forward) performance patterns.
# Distilled from a hand-tuned, GPU-validated fused-attention kernel on Intel Xe2
# (Battlemage): flash_attention_fwd_wg.mlir. Each pattern below is observed in
# that kernel and carries a precondition so it fires only on the attention hot
# path. Hardware focus: Intel Xe2 (BMG) / Xe-HPC (PVC).
language: mlir
device: xpu
category: optimization

patterns:
  - id: xegpu_multibuffer_prefetch_pipeline
    name: "Software-pipelined multi-buffered xegpu.prefetch_nd (prefetch N tiles ahead, dedicated layout, no branch)"
    stage: memory_access
    scope: sku_specific
    skus: [bmg, pvc, arc_a770]
    tags: [prefetch, multibuffer, software-pipeline, attention, memory_access, latency-hiding]
    expected_speedup: "1.2-1.7x on the memory-bound K/V stream of an attention K-loop"
    precondition: |
      APPLIES ONLY to a streaming inner loop that walks a large operand tile-by-tile
      (attention K/V over N_CTX; GEMM K-loop over a long contraction). The win comes
      from hiding global-load latency, so it applies when the loop is memory-latency
      bound and there are enough iterations (>= ~3-4) to fill the pipeline.

      Do NOT convert a single per-iteration prefetch guarded by scf.if into this form
      naively: an scf.if-guarded, one-iteration-ahead prefetch on this hardware has
      REGRESSED in practice (branch overhead + too-short lead distance to hide L3/HBM
      latency). The correct form is branch-free with a lead distance of 3 tiles.
      Requires the tensor_desc / hardware to tolerate out-of-bounds prefetch of the
      trailing tiles (prefetch is a hint and must not fault); verify [ALLCLOSE: TRUE]
      is unchanged (prefetch is side-effect-free on results).
    description: |
      Build a depth-3 (triple-buffered) prefetch pipeline for each streamed operand:
        1. PROLOGUE, before the loop: issue 3 prefetch_nd at tile offsets
           base, base+BLOCK_N, base+2*BLOCK_N (fills the pipe 3 tiles deep).
        2. IN-LOOP, at the top of iteration k: issue ONE prefetch_nd at
           base + 3*BLOCK_N + k -- i.e. 3 tiles ahead of the tile being consumed
           this iteration. No scf.if guard.
      Use a SEPARATE prefetch layout that spreads the prefetch across subgroups
      differently from the compute-load layout: e.g. compute load #k = sg_layout=[8,1]
      sg_data=[16,64], but prefetch #k_prefetch = sg_layout=[4,2] sg_data=[16,32]. The
      prefetch layout's job is broad L1/L2/L3 coverage of the 64x64 tile, not feeding
      DPAS, so a 4x2 spread pulls the whole tile with fewer, wider messages. All
      prefetch_nd carry l1/l2/l3 = cached.
    rationale: |
      A one-iteration-ahead prefetch only hides ~1 tile of latency; global-load
      latency on Xe2 spans several tiles, so the load still stalls. Prefetching 3
      tiles ahead keeps 3 outstanding cache-fills in flight, so by the time load_nd
      consumes tile k the line is already resident. Dropping the scf.if removes a
      per-iteration branch on the hot path. A dedicated wide prefetch layout decouples
      "how we cover the tile in cache" from "how DPAS wants the data laid out."
    pattern_before: |
      scf.for %k = %c0 to %N_CTX step %BLOCK_N iter_args(...) {
        // one-iteration-ahead, guarded -- REGRESSES on Xe2
        %next = arith.addi %k, %BLOCK_N : index
        %ok = arith.cmpi slt, %next, %N_CTX : index
        scf.if %ok {
          xegpu.prefetch_nd %k_pf[%wg_x_offset_plus_next, %c0]
            {l1_hint=#xegpu.cache_hint<cached>, ...} : !xegpu.tensor_desc<64x64xf16, #k>
        }
        %kv = xegpu.load_nd %k_tile[%wg_x_offset_plus_k, %c0] ...
        ...
      }
    pattern_after: |
      // dedicated wide prefetch layout
      #k_prefetch = #xegpu.layout<sg_layout=[4,2], sg_data=[16,32], inst_data=[16,16]>
      %k_pf = xegpu.create_nd_tdesc %K, shape:[...], strides:[...]
        : memref<?x?xf16> -> !xegpu.tensor_desc<64x64xf16, #k_prefetch>
      // PROLOGUE: fill the pipe 3 tiles deep
      xegpu.prefetch_nd %k_pf[%base, %c0]              {l1_hint=#xegpu.cache_hint<cached>, ...}
      xegpu.prefetch_nd %k_pf[%base_plus_BLOCK_N, %c0] {l1_hint=#xegpu.cache_hint<cached>, ...}
      xegpu.prefetch_nd %k_pf[%base_plus_2BLOCK_N,%c0] {l1_hint=#xegpu.cache_hint<cached>, ...}
      %BLOCK_N_3 = arith.muli %BLOCK_N, %c3 : index
      scf.for %k = %c0 to %N_CTX step %BLOCK_N iter_args(...) {
        // IN-LOOP: branch-free, 3 tiles ahead
        %ahead = arith.addi %BLOCK_N_3, %k : index
        %off   = arith.addi %base, %ahead : index
        xegpu.prefetch_nd %k_pf[%off, %c0] {l1_hint=#xegpu.cache_hint<cached>, ...}
        %kv = xegpu.load_nd %k_tile[%wg_x_offset_plus_k, %c0] ...
        ...
      }
    notes: |
      Lead distance is a tunable: 3 is the validated value on BMG for a 64-wide K
      block; deeper pipes cost more register/cache residency for marginal latency
      gain. Issue the K prefetch AND the V prefetch at the same running offset (both
      streams advance together in attention). See xegpu_add_prefetch_nd for the base
      "add a prefetch at all" pattern; this is its production-grade multi-buffer form.

  - id: xegpu_kslice_transpose_dpas
    name: "QK^T via 16-row K slices + in-register vector.transpose + unrolled DPAS"
    stage: device_specific
    scope: sku_specific
    skus: [bmg, pvc, arc_a770]
    tags: [dpas, register-pressure, transpose, attention, unroll, device_specific]
    expected_speedup: "1.1-1.3x vs loading the full 64x64 K tile (fewer spills, better DPAS overlap)"
    precondition: |
      APPLIES to the QK^T matmul of attention (or any A*B^T where B arrives
      row-major but DPAS wants it as the B/transposed operand) when the full B tile
      would inflate register pressure. Requires DPAS with an f32 accumulator and f16
      A/B inputs. Do NOT apply if a hardware transposed-load path is available and
      cheaper, or if the tile already fits comfortably in registers.
    description: |
      Instead of loading K as one 64x64 tile, load it as 4 slices of 16x64. For each
      slice: xegpu.load_nd -> vector<16x64xf16>, vector.transpose [1,0] ->
      vector<64x16xf16>, then xegpu.dpas %q_value (128x64), %k_slice_t (64x16),
      %zero (128x16) -> vector<128x16xf32>. This yields four 128x16 QK partials
      (columns [0:16],[16:32],[32:48],[48:64] of the 128x64 score tile). Interleave
      load(slice i+1) with dpas(slice i) so loads overlap compute. The transpose
      happens in-register because K is stored row-major ([N, D]) but DPAS-B wants D
      on the contraction axis; encode the transposed layout as order=[0,1].
    rationale: |
      Holding the whole 64x64 K tile plus the 128x64 Q tile plus the loop-carried
      128x64 f32 accumulator overruns even a 256-GRF budget and forces spills.
      Slicing K into 16-row chunks caps the live K footprint to one 16x64 slice at a
      time; the 4-way unroll keeps 4 independent DPAS in flight for the DPAS pipeline
      while the next slice loads. In-register transpose avoids a separate transposed
      global load.
    pattern_before: |
      %kT = xegpu.load_nd %k_tile[%off, %c0] ... : ... -> vector<64x64xf16>  // whole tile, heavy
      %qk = xegpu.dpas %q_value, %kT, %zero_128x64 : vector<128x64xf16>, vector<64x64xf16>, vector<128x64xf32> -> vector<128x64xf32>
    pattern_after: |
      // 4 x (load 16x64 slice -> transpose -> dpas -> 128x16 partial)
      %k0t = xegpu.load_nd %k_slice[%off,    %c0] ... -> vector<16x64xf16>
      %k0  = vector.transpose %k0t, [1, 0] : vector<16x64xf16> to vector<64x16xf16>
      %qk0 = xegpu.dpas %q_value, %k0, %zero_128x16 {layout_a=#q, layout_b=#kt, layout_cd=#qk} : vector<128x64xf16>, vector<64x16xf16>, vector<128x16xf32> -> vector<128x16xf32>
      %k1t = xegpu.load_nd %k_slice[%off+16, %c0] ... -> vector<16x64xf16>
      %k1  = vector.transpose %k1t, [1, 0] : vector<16x64xf16> to vector<64x16xf16>
      %qk1 = xegpu.dpas %q_value, %k1, %zero_128x16 {...} -> vector<128x16xf32>
      // ... slices 2, 3 identically -> %qk2, %qk3
    notes: |
      The four 128x16 partials are the natural inputs to the online-softmax max/sum
      tree-reductions (arith.maximumf over the 4 partials, then vector.multi_reduction
      along dim 1). Pairs with xegpu_truncf_scores_to_f16_for_pv and
      xegpu_f32_accumulator_softmax_recipe.

  - id: xegpu_truncf_scores_to_f16_for_pv
    name: "Truncate exp'd softmax scores f32->f16 before the P*V DPAS; keep the accumulator f32"
    stage: dtype_fix
    scope: sku_specific
    skus: [bmg, pvc, arc_a770]
    tags: [dpas, dtype, truncf, attention, mixed-precision, dtype_fix]
    expected_speedup: "enables the P*V DPAS at full f16 throughput; correctness-preserving"
    precondition: |
      APPLIES to the second matmul of attention, P*V, where P = exp(scores) is
      computed in f32 (softmax must run in f32 for numerical range) but DPAS-A wants
      an f16/bf16 input. Do NOT truncate the accumulator or the running softmax
      statistics (m_i, l_i) -- only the P operand fed to DPAS.
    description: |
      After computing the exp'd, centered scores in f32 (vector<128x16xf32> per
      slice), arith.truncf each to vector<128x16xf16>, then feed those as the A
      operand of xegpu.dpas against the f16 V slices, accumulating into the f32
      128x64 output. The softmax max/sum/alpha arithmetic stays entirely in f32.
    rationale: |
      DPAS runs at peak throughput with f16/bf16 inputs and an f32 accumulator.
      Softmax needs f32 dynamic range (exp of centered scores), but once P is
      exponentiated its values are in [0,1] and lose little to f16, so truncating
      only the DPAS-A input keeps peak matmul throughput without hurting [ALLCLOSE].
    pattern_before: |
      %p0 = math.exp %centered0 fastmath<fast> : vector<128x16xf32>
      // f32 P fed to DPAS -> slow / illegal DPAS-A dtype
      %pv = xegpu.dpas %p0, %v0, %acc : vector<128x16xf32>, vector<16x64xf16>, vector<128x64xf32> -> vector<128x64xf32>
    pattern_after: |
      %p0    = math.exp %centered0 fastmath<fast> : vector<128x16xf32>
      %p0_f16 = arith.truncf %p0 : vector<128x16xf32> to vector<128x16xf16>
      %pv = xegpu.dpas %p0_f16, %v0, %acc {layout_a=#qk, layout_b=#v, layout_cd=#out} : vector<128x16xf16>, vector<16x64xf16>, vector<128x64xf32> -> vector<128x64xf32>
    notes: |
      Reinforces mlir_dpas_operand_dtype_contract: the rule is f16/bf16 DPAS *inputs*,
      f32 *accumulator*. The truncf sits between the softmax exp and the P*V DPAS.

  - id: xegpu_softmax_reduction_fastmath
    name: "Attach fastmath<fast> to softmax max-reductions and exp on the attention hot path"
    stage: device_specific
    scope: sku_specific
    skus: [bmg, pvc, arc_a770]
    tags: [fastmath, softmax, attention, reduction, exp, device_specific]
    expected_speedup: "1.05-1.2x on the softmax-bound inner loop"
    precondition: |
      APPLIES to the online-softmax reductions and exp inside an attention K-loop:
      the arith.maximumf tree that folds the QK partials, the running-max update, and
      the math.exp of centered scores and of the (m_old - m_new) alpha correction.
      Verify [ALLCLOSE: TRUE] survives -- fastmath<fast> permits reassociation and the
      fast (approximate) exp expansion; on attention with ~1e-2..1e-3 tolerance this
      passes. Do NOT apply where the oracle demands bit-accurate exp/reductions.
    description: |
      Add fastmath<fast> to every arith.maximumf used in the softmax max reduction
      (both the pairwise tree over the 4 QK partials and the running-max update
      m_ij = max(scaled_max, m_i)) and to every math.exp (the exp of centered scores
      and the exp of the alpha = m_old - m_new correction). This is the VERIFIED,
      in-production spelling used by the tuned WG kernel: it keeps math.exp (does not
      hand-rewrite to exp2) and lets IGC route to the fast native exp expansion while
      relaxing reduction ordering.
    rationale: |
      Without fastmath, arith.maximumf keeps strict NaN/ordering semantics and
      math.exp may select a higher-precision software path. fastmath<fast> lets IGC
      reassociate the reductions (cheaper tree) and pick the fast exp2-based exp
      expansion. On a long K-loop the softmax runs every iteration, so this compounds.
    pattern_before: |
      %m_t0 = arith.maximumf %qk0, %qk1 : vector<128x16xf32>
      %m_ij = arith.maximumf %m_scaled, %m_i : vector<128xf32>
      %p    = math.exp %centered : vector<128x16xf32>
      %alpha = math.exp %m_diff : vector<128xf32>
    pattern_after: |
      %m_t0 = arith.maximumf %qk0, %qk1 fastmath<fast> : vector<128x16xf32>
      %m_ij = arith.maximumf %m_scaled, %m_i fastmath<fast> : vector<128xf32>
      %p    = math.exp %centered fastmath<fast> : vector<128x16xf32>
      %alpha = math.exp %m_diff fastmath<fast> : vector<128xf32>
    notes: |
      Complementary to xegpu_exp2_not_exp_softmax: that pattern folds log2(e) into the
      score scale and calls math.exp2 (the explicit route, and what the CPU reference
      emulates); THIS pattern is the lighter-touch route the tuned kernel actually
      ships -- keep math.exp, just tag fastmath<fast>. Try fastmath first; reach for
      the explicit exp2 rewrite only if timing shows IGC didn't take the native path.

constraints:
  - id: xegpu_grf_budget_loop_accumulators
    name: "Size loop-carried f32 accumulators to the GRF budget; FA-class kernels REQUIRE large-register-file"
    severity: warning
    stage: device_specific
    scope: sku_specific
    skus: [bmg, pvc, arc_a770]
    tags: [grf, register-pressure, spill, large-register-file, attention, device_specific]
    precondition: |
      APPLIES when a scf.for carries large f32 accumulators/statistics across
      iterations (e.g. attention: a 128x64xf32 output accumulator = 32 KB per WG tile,
      plus the resident 128x64xf16 Q tile and running m_i/l_i vectors). Relevant to
      any WG kernel whose loop-carried live state approaches the register-file size.
    description: |
      At the default 128 GRF the loop-carried accumulators of a WG flash-attention
      kernel do not fit and IGC spills (~8.9 KB, ~282 spill/fill accesses in the loop
      body) -- catastrophic on the hot path. Compile with the large-register-file flag
      to get 256 GRF: pass igc-cmd-options=-ze-opt-large-register-file through
      --gpu-lower-to-xevm-pipeline. This is a COMPILE FLAG, not an IR edit, so it is
      correctness-neutral (identical results, just no spills) -- exactly the kind of
      knob a GRF-sweep should always try for accumulator-heavy kernels. Conversely,
      budget the design so loop-carried f32 state fits in 256 GRF: prefer slicing
      operands (see xegpu_kslice_transpose_dpas) over holding whole tiles resident.
    rationale: |
      GRF spills turn register accesses into memory traffic inside the innermost loop;
      at ~282 spill/fill per iteration over thousands of K-steps this dominates
      runtime. 256 GRF removes the spills for the standard 128x64 FA accumulator. The
      flag is free correctness-wise, so failing to set it is pure lost performance on
      any kernel whose accumulator is large enough to spill at 128 GRF.
    fix: |
      // in the RUN / lowering pipeline options:
      --gpu-lower-to-xevm-pipeline="xegpu-op-level=workgroup igc-cmd-options=-ze-opt-large-register-file"
      // and keep loop-carried f32 live state <= 256 GRF (slice operands if needed).
