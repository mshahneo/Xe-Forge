kb_schema_version: 1
# CONCERN: STREAMING (bandwidth-bound) memory traffic in WG-level XeGPU MLIR.
#
# This file is about kernels where every byte is touched a small constant number
# of times and DRAM is the limit: softmax, layernorm/RMSnorm, elementwise chains,
# copies/transposes, scale+cast passes, reduction epilogues. That is a DIFFERENT
# concern from xegpu_memory_patterns.yaml, which is about feeding DPAS (prefetch
# depth, operand tiling, transpose folding, register liveness). Here there is no
# reuse to exploit — the goal is to move each byte exactly once, with the widest
# message, no predicate, and no cache pollution.
#
# Decide whether to open this file at all using the roofline rules in
# common/bandwidth_roofline.yaml: a kernel already at >=85% of DRAM peak cannot
# be helped by anything below.
#
# PROVENANCE. The rules here are distilled from a fused-softmax study of the
# Intel XPU Triton backend on Arc B580 (Xe2/Battlemage), f32, 1K/2K/4K/8K square,
# with full TTIR/TTGIR/LLVM-IR, 70-pass MLIR logs and IGC Xe2 ISA dumps:
#   /data/gta/upstream/triton-softmax-study/REPORT.md
# Each entry states whether the effect was MEASURED end-to-end or only OBSERVED
# in that backend's IR/ISA and then translated to XeGPU. Nothing here has been
# A/B timed on an MLIR kernel yet — treat the speedup ranges as hypotheses to be
# confirmed by the verifier, and BELIEVE THE TIMING over this file.
#
# Hardware: Intel Xe2 (BMG B580/B570), SIMD16/SIMD32 subgroups, 18 MiB L2,
# 256 B cache line, 456 GB/s peak DRAM (B580).
language: mlir
device: xpu
category: optimization

constraints:
  - id: xegpu_streaming_lane_chunk_must_be_128_bit
    name: "On a streaming access, each lane should own a CONTIGUOUS run of the stride-1 axis; 128 bit is a good default, not a requirement"
    severity: warning
    stages: [memory_access, analysis]
    description: |
      CORRECTED 2026-09-16 — the requirement is CONTIGUITY, not message width. The
      old text said 128-bit-per-lane was mandatory and rated this critical. Two A/B
      measurements on BMG B580 say message width is close to neutral. Read
      "MEASURED: WIDTH IS NOT THE LEVER" below before acting on this entry.

      For any load_nd / store_nd of a read-once or write-once tensor, prefer to give
      each lane a CONTIGUOUS 16-byte (128-bit) run along the stride-1 dimension:
      lane_data = [1, 4] for f32, [1, 8] for f16/bf16 on a row-major row.
      16 B/lane x 32 lanes = one 512-byte message, which is two full 256 B Xe2
      cache lines. It is a sensible default. It is not a correctness or a
      performance requirement.

      MEASURED: WIDTH IS NOT THE LEVER (Arc B580, f32 softmax 4096x4096, 500 runs,
      interleaved, `[ALLCLOSE: TRUE]` every run).

      1. Forcing the wide message made it SLOWER. Adding
         `inst_data = [8, 16]` to the reduction-source load_nd removed every 64 B
         message (load destinations went 32x `rN:1` + 4x `rN:8` -> 8x `rN:8`) and
         cut instCount 1682 -> 1583. Time went 0.6662 -> 0.6693 ms, i.e. 0.5%
         SLOWER, with 6/6 interleaved pairs agreeing in sign.
         WHY: a 2D block load of 8 rows x 16 columns is NOT contiguous. It gathers
         8 separate 64 B lines 16 KB apart. Merging them into one message does not
         change which DRAM lines are touched, so DRAM does the same work.

      2. The fastest kernel we have issues ONLY 64 B messages. The single-pass
         softmax `sm_4096_sg16` reaches 87.5% of DRAM peak (0.336 ms) with
         lane_data = [1, 1] and `bkl2d.shape = 1x16x1` on every load and store.
         That is one quarter of the "required" width and it ties Triton.

      SO WHAT ACTUALLY MATTERS: how long a contiguous run a workgroup touches at
      one instant. Independent evidence from the same study: widening the column
      tile of the 3-pass kernel, which lengthens each per-row contiguous run and
      changes nothing else, moved it 0.6660 -> 0.6423 ms at width 128 (1.036x).
      Past that it regresses hard (width 256 = 0.739 ms, width 512 = 1.328 ms).

      USE THIS RULE INSTEAD: make the run contiguous first, then stop. Reach for
      lane_data = [1, 4] when it is free, but do not spend a `convert_layout`, a
      relayout, or extra register pressure to buy it — on a reduction source the
      layout pass will insert `xegpu.convert_layout` to get back to lane_data = 1
      anyway, and we measured that as a net loss.

      HOW TO SCALE UP a bigger tile: grow sg_layout (more subgroups, up to the
      1024-thread workgroup limit), NOT lane_data. Per-lane width is a hardware
      message property and saturates; subgroup count is the free dimension.
      Only once sg_layout has filled the workgroup should a lane take a second
      16 B chunk (which issues a second message, not a wider one).

      WRONG (lane owns a strided/gapped run, or a >128-bit run on the
      non-contiguous axis):
        #xegpu.layout<sg_layout = [1, 8], sg_data = [64, 2], lane_data = [2, 1]>

      CORRECT (contiguous inner dim is the per-lane vector dim, 4 x f32 = 16 B):
        #xegpu.layout<sg_layout = [8, 1], sg_data = [8, 64], lane_layout = [1, 16], lane_data = [1, 4]>

      OBSERVED (Triton/Arc B580, f32 softmax, all four sizes): the backend pinned
      sizePerThread = 4 f32 = 16 B/lane at EVERY size and grew warpsPerCTA
      8 -> 16 -> 32 instead, saturating at 32 warps = 1024 threads. The ISA shows
      exactly the intended message, `load.ugm.d32x4.a64 (32|M0)` = 512 B, and
      `d32x4` is the widest per-lane vector that backend emits. At 8192 columns,
      with warps already saturated, each lane took 8 elements and the ISA issued
      TWO d32x4 loads — it never merged them into a d32x8. That is the saturation
      point made visible.

      This is the LOAD-side companion of xegpu_store_nd_contiguous_128b (which
      states the same 128-bit no-gap rule for stores, derived independently from
      Intel's Coalesce pass). On a streaming kernel BOTH sides must obey it,
      because reads and writes each carry half the traffic.

  - id: xegpu_streaming_needs_explicit_cache_hints
    name: "No pass adds cache hints for you; a read-once stream must say streaming / write_through"
    severity: warning
    stages: [memory_access, device_specific]
    description: |
      Do not expect the compiler to classify your traffic. Annotate load_nd /
      store_nd on read-once and write-once data explicitly:

        read-once  input  -> l1_hint = <streaming>, l2_hint = <streaming>
                             (or <uncached>; `streaming` is READ-ONLY in XeGPU)
        write-once output  -> l1_hint = <write_through>, l2_hint = <write_through>
                             (or <uncached>; both are WRITE-ONLY policies)
        reused     operand -> l1_hint = <cached>, l2_hint = <cached>
                             (that is the DIFFERENT rule xegpu_cache_hint_on_load;
                              do not apply <cached> to streaming data)

      Legal XeGPU cache_hint values and their direction:
        cached (r/w), uncached (r/w), streaming (read only),
        read_invalidate (read only), write_back (write only),
        write_through (write only).
      Using a read-only policy on a store, or a write-only policy on a load, is
      invalid IR — check the direction before emitting.

      WHY IT MATTERS: an 18 MiB L2 filled with data that will never be re-read
      evicts data that would have been. On a kernel that streams more than L2 the
      hint costs nothing and protects any co-resident reuse.

      OBSERVED (Triton/Arc B580): `TritonIntelGPUAnnotateCacheControl` runs in the
      pipeline and was a complete NO-OP for this kernel — the tt.load/tt.store are
      byte-identical before and after it, and the final ISA issues
      `load.ugm.d32x4.a64` / `store.ugm.d32x4.a64` with default caching. Only the
      kernel-argument loads got hints. So the most bandwidth-relevant annotation
      on a bandwidth-bound kernel was simply never applied. UNMEASURED: the study
      did not A/B the hints, because that kernel was already at 87-88% of peak and
      had no headroom to show a win. Expect the payoff on a kernel that is BELOW
      the roofline stop line, or that shares L2 with something else.

  - id: xegpu_streaming_boundary_check_false_on_both_load_and_store
    name: "When the tile divides the shape, turn boundary_check off on the STORE too, not just the load"
    severity: warning
    stages: [memory_access]
    description: |
      A predicated access costs flag-register setup and blocks the unpredicated,
      widest form of the message. When the tensor extent is a known multiple of
      the tile on every accessed dimension, set
      `#xegpu.block_tdesc_attr<boundary_check = false>` on the descriptor — and do
      it for the OUTPUT descriptor as well as the input ones.

      The store side is the one that gets forgotten, and on a streaming kernel it
      is half the traffic.

      If divisibility only holds for some shapes, emit two versions under an
      scf.if on the runtime extent and put the unpredicated form in the fast arm.
      That is strictly better than one always-masked kernel, and it is what the
      Triton backend does automatically (see below) — in MLIR you must write it.

      OBSERVED (Triton/Arc B580): `TritonIntelRemoveMasks` proves the bounds mask
      redundant and CLONES THE WHOLE ROW LOOP into two versions under
      `arith.cmpi sgt, %n_cols, %c4095_i32`; the fast arm's tt.load carries no mask
      and no `other=-inf`, which also deletes the -inf fill and the select ahead of
      the max reduction. It reaches the ISA as a genuinely unpredicated
      `load.ugm.d32x4.a64` next to the `(f0.0)`-predicated one.
      BUT that pass handles `tt::LoadOp` ONLY — it asserts so at
      RemoveMasks.cpp:941 — so the STORE stayed `(f0.0) store.ugm.d32x4.a64` in
      BOTH arms, including the arm where the mask is provably all-true. A real
      compiler shipped the asymmetry; assume yours does too and set the store side
      by hand. UNMEASURED as an isolated change.

  - id: xegpu_divf_by_a_reduction_scalar_expands_to_ieee_fixups
    name: "arith.divf by a row scalar is not strength-reduced; hoist the reciprocal yourself"
    severity: warning
    stages: [device_specific, algorithmic]
    description: |
      A normalization tail written as `tile / row_scalar` keeps full IEEE division
      semantics all the way down. IGC then expands EACH division into a scale, a
      scalar `math.inv`, two SIMD32 multiplies, and `cmp` + `sel 1.0f` fixups for
      the denormal/infinity cases. That whole chain is per-element work that a
      single reciprocal plus a multiply would replace.

      Compute the reciprocal ONCE per row, then multiply:
        %r = arith.divf %one, %denom : f32          // one division, scalar
        %y = arith.mulf %tile, %r_bcast             // per-element multiply only
      Tag the reciprocal with fastmath<afn> if the tolerance allows it, so IGC
      picks the native fast inverse instead of the exact expansion.

      WHEN IT PAYS: only when the kernel is NOT at the DRAM roofline. At >=85% of
      peak this is free-but-invisible. It matters on the small, L2-resident,
      launch-and-compute-bound sizes — which is exactly where the softmax study
      saw the Triton kernel LOSE to torch (0.79x at 1024x1024). Check residency
      first with bw_working_set_must_exceed_l2_or_measurement_is_not_dram.

      OBSERVED (Triton/Arc B580): `numerator / denominator` survives as `fdiv` in
      the emitted LLVM IR (llir lines 177-180) and expands into the scalar
      `math.inv` + 2 SIMD32 `mul` + `cmp`/`sel 1.0f` chain in the Xe2 ISA
      (lines 935-975). Triton did not strength-reduce it. UNMEASURED.

  - id: xegpu_streaming_fix_contiguity_and_occupancy_not_message_width
    name: "On a bandwidth-bound kernel, fix contiguity and thread count first; message width is close to neutral"
    severity: warning
    stages: [analysis, memory_access, algorithmic]
    description: |
      ANALYSIS TRIGGER: report issue_type: uncoalesced_access, stage: memory_access,
      when a bandwidth-bound kernel is below ~80% of DRAM peak AND a workgroup's live
      footprint is SCATTERED — that is, one iteration touches several short runs far
      apart in memory rather than one long contiguous run. Compute the run length:
      (elements a subgroup reads per instruction along the stride-1 axis) x
      element_size. Compare it to the distance between runs. If instead the run is
      already contiguous and the problem is the subgroup count, report
      issue_type: suboptimal_warps, stage: memory_access.

      ORDER THE LEVERS LIKE THIS. Measured on BMG B580, f32 softmax 4096x4096.

        | lever | effect | measured |
        |---|---|---|
        | 1. cut array passes AND make the run contiguous | 1.982x | 0.6665 -> 0.3362 ms |
        | 2. lengthen the contiguous run alone | 1.036x | 0.6660 -> 0.6423 ms (tile W 16 -> 128) |
        | 3. use the default GRF, not large | 1.007x | 0.3386 -> 0.3362 ms |
        | 4. widen the per-lane message | 0.995x, a LOSS | 0.6662 -> 0.6693 ms |

      LEVER 4 IS A TRAP and it is the one people reach for first. Forcing
      `inst_data = [8, 16]` on a reduction-source load removed every 64 B message
      and cut instCount 1682 -> 1583, and it ran 0.5% SLOWER (6/6 interleaved pairs
      agreeing). The reason is that an 8-row x 16-column 2D block load is not
      contiguous: it gathers 8 separate 64 B lines 16 KB apart. One message or
      eight, DRAM touches the same lines.

      THE PROOF THAT WIDTH DOES NOT MATTER: the fastest kernel in the study issues
      NOTHING but 64 B messages (`bkl2d.shape = 1x16x1`, lane_data = [1, 1]) and
      reaches 87.5% of DRAM peak. A quarter of the "recommended" width, at peak.

      WHAT THE 1.982x ACTUALLY BOUGHT, and why it is one change not two:

        | | before | after |
        |---|---|---|
        | array passes over the input | 3 (2 reads + 1 write) | 2 |
        | a workgroup's live footprint | 64 lines of 64 B spread over 1 MB | one contiguous 16 KB row |
        | hardware threads | 512 | 65536 |

      Do not model traffic and efficiency as separate levers to be multiplied. The
      decomposition sets both.

      HOW TO CHECK IN THE ISA: `grep 'bkl2d.shape'` gives the per-message tile.
      A shape like `1x16x8` means 8 separate single-row messages with 8 Y offsets —
      scattered. `1x16x1` repeated at consecutive offsets means one contiguous run.
      Scattered is the problem; the number of messages is not.

      SOURCE: `test/lightouse_softmax_tuning/triton-vs-xe-forge/REPORT.md`,
      2026-09-16, 500 runs x 4-6 interleaved reps, `[ALLCLOSE: TRUE]` every run.
      NOT CHECKED: other dtypes, gather/scatter (as opposed to 2D block) access,
      and kernels with data reuse — this is a streaming rule only.

  - id: xegpu_cross_subgroup_reduction_slm_should_be_tiny
    name: "Cross-subgroup reduction SLM should be one element per subgroup, not one per row element"
    severity: warning
    stages: [algorithmic, memory_access]
    description: |
      A row reduction must NOT stage the row through SLM. The correct shape is two
      levels:
        1. lane-private partial in registers (free), then
        2. ONE cross-lane reduction inside the subgroup (hardware instruction), then
        3. one partial per subgroup through SLM + a workgroup barrier.

      SLM footprint is therefore `num_subgroups * sizeof(elem)` — tens to a couple
      hundred bytes — and is INDEPENDENT of the row length. If your SLM allocation
      scales with the reduced extent, you have hand-rolled a tree that the
      hardware subgroup reduction should have done, and you are paying SLM
      bandwidth plus extra barriers for it. Large SLM per workgroup also caps how
      many workgroups fit per Xe-core, so this shows up as an occupancy loss too.

      Step 1 is the existing xegpu_softmax_reduction_split_intra_lane pattern;
      this constraint is about steps 2-3 and about the SLM SIZE being the check
      you can apply mechanically.

      OBSERVED (Triton/Arc B580, f32 softmax): both reductions (max and sum) lower
      to a single `__spirv_GroupNonUniformFMax` / `__spirv_GroupNonUniformFAdd`
      within the subgroup, then 32 partials through SLM plus a barrier. Measured
      SLM per workgroup was 32 / 64 / 128 / 128 bytes for the 1K / 2K / 4K / 8K
      shapes — i.e. exactly num_warps * 4 B, flat in the row length (1024 to 8192
      elements). Barrier count was 12 at every size. SLM never limited occupancy.

  - id: xegpu_online_softmax_still_reads_twice_unless_the_row_is_register_resident
    name: "Two-loop online softmax reads the input twice; only a register-resident row cuts it to one"
    severity: critical
    stages: [analysis, algorithmic, memory_access]
    description: |
      ANALYSIS TRIGGER: two xegpu.load_nd reading the SAME base memref in
      different scf.for loops = a 3-pass softmax/layernorm (2 reads + 1 write)
      where 2 suffice. Report issue_type: redundant_computation, stage:
      algorithmic. Hard 1.5x penalty; no cache hint, prefetch or faster math
      removes it. Fix: one row per subgroup, row held in registers.

      Writing softmax/layernorm as an online (single-statistics-pass) algorithm
      does NOT by itself get you to minimum traffic. The usual XeGPU shape is two
      scf.for loops over the same row:

        loop 1: load tile -> running max + rescaled running sum   (no store)
        loop 2: load THE SAME TILE AGAIN -> (x - max) / sum -> store

      That is 2 reads + 1 write = 3 array passes, where the algorithm allows 2.
      The extra read is a hard 1.5x ceiling on achievable time, and no amount of
      cache hints, prefetch or cheaper math removes it.

      HOW TO CHECK: count `xegpu.load_nd` ops that read the SAME base memref in
      different loops. Two such loads on one input = the 3-pass shape.

      WHY IT HAPPENS: the decomposition, not the algorithm. A kernel that gives
      each workgroup MANY ROWS and tiles the COLUMNS (e.g. a 64x16xf32 tile
      stepping the column axis) cannot hold a row across the two loops, so it must
      re-read. A kernel that gives each program ONE ROW and covers the whole row at
      once keeps it in registers and reads once.

      MEASURED (Arc B580, f32, device kernel time, median of 5 processes):
        XeGPU WG softmax, 3-pass, 64x16 column-tiled:
          4096x4096 = 0.690 ms -> 63.9% of peak on its OWN 3-pass traffic,
                                  42.6% against the 2-pass minimum
          8192x8192 = 3.208 ms -> 54.8% / 36.7%
        Triton, 2-pass, one row per program, row held in registers
        (n_regs=128, n_spills=0):
          4096x4096 = 0.339 ms -> 86.8% of peak
          8192x8192 = 1.336 ms -> 88.1% of peak
      Triton is 2.04x / 2.40x faster. The gap factors as 1.5x (the extra pass)
      times ~1.38x (streaming efficiency), which reproduces the 2.04x at 4K.

      FIX NOW MEASURED, 2026-09-16, BMG B580, 4096x4096 f32, 500 runs, interleaved:
        3-pass, 64x16 column-tiled  : 0.666510 ms (66.2% of peak on 3-pass traffic)
        single-pass, row-resident   : 0.336232 ms (87.5% of peak) -> 1.982x
      Triton on the same day: 0.3384 ms. So the single-pass XeGPU kernel TIES the
      Triton reference. Working kernel:
      `test/lightouse_softmax_tuning/triton-vs-xe-forge/xe-forge/sweep/sm_4096_sg16.mlir`.
      Full study: `.../triton-vs-xe-forge/REPORT.md`.

      CORRECTION — "the gap factors as 1.5x x 1.38x, two independent levers" is
      WRONG. Both factors come from the same decomposition and one change moved
      both. Do NOT plan around "cutting the pass alone caps at 1.5x". Cutting the
      pass also made the stream contiguous (a workgroup's live footprint went from
      64 scattered 64 B lines spread over 1 MB to one contiguous 16 KB row) and
      raised thread count from 512 to 65536, so the efficiency factor came along
      for free.

      COST TO WATCH: a register-resident row needs row_len / threads_per_wg f32 per
      lane, and TWO live arrays (the row and exp(x-max)), so budget
      2 * row_len / threads_per_wg GRF-equivalents. Note this scales with WORKGROUP
      threads, not subgroup lanes — spread the row over many subgroups and even
      N=8192 is cheap (8192/512 = 16 f32/lane). Measured: no GRF spills at 128 GRF
      for N=4096 with 256 threads. See also xegpu_grf_budget_loop_accumulators.

  - id: xegpu_large_grf_is_not_a_lever_for_bandwidth_bound_kernels
    name: "Do not spend the large-GRF flag on a bandwidth-bound kernel; it measures as noise"
    severity: warning
    stages: [analysis, device_specific, autotuning]
    description: |
      `igc-cmd-options=-ze-opt-large-register-file` is a real win on compute-bound
      XeGPU kernels (flash attention: 1.18-1.45x; attention WG lowering: 4.46 ->
      2.58 ms). It is NOT a lever when the kernel is limited by DRAM: more
      registers cannot make the pipe wider.

      MEASURED NULL RESULT (Arc B580, f32 softmax, deterministic two-point sweep,
      median of 5 independent processes per point, 16 points total):
        1024x1024  1.042x / 1.023x   (baseline / tuned kernel)
        2048x2048  1.175x / 0.977x
        4096x4096  1.014x / 1.004x
        8192x8192  0.964x / 1.015x
      Every point is within +-4% except the 2K baseline 1.175x, and that point's
      own process-to-process spread was 0.283-0.431 ms, so it is inside its own
      noise. Verdict: neutral, both directions, at every size.

      RULE: gate the GRF sweep on the roofline (see
      bw_compute_dram_roofline_before_optimizing). If the kernel is bandwidth-
      bound, skip the sweep and spend the budget on cutting min_bytes instead.
      Note the sweep verdict also goes STALE after any source change, so when you
      do run it, run it LAST.

      STRENGTHENED 2026-09-16: on a bandwidth-bound kernel large GRF can be an
      active LOSS, not just noise. Measured on the single-pass softmax 4096x4096,
      500 runs, 4 interleaved reps:

        | config | large GRF (256) | default GRF (128) |
        |---|---|---|
        | 1 row/WG, 16 subgroups | 0.338572 ms | **0.336232 ms** |
        | 1 row/WG, 8 subgroups  | 0.341276 ms | 0.340808 ms |
        | 2 rows/WG, 4 subgroups | 0.459524 ms | 0.492258 ms |

      Default wins every row. WHY: large GRF halves the hardware thread slots
      (1280 -> 640 on B580). If the kernel has no spills at 128 GRF, the larger
      budget buys nothing and costs half the memory-level parallelism. So the check
      is not "is it bandwidth bound" but "does it spill at 128" — if not, take the
      default and keep the thread slots.

      ALWAYS INCLUDE THE DEFAULT POINT in the sweep. A one-sided "try large GRF"
      test cannot find this.

      SWEPT ACROSS SIZES 2026-09-16 — default won 10 of the 11 configs where both GRF
      modes ran. Single-pass softmax, medians in ms:

        | N | subgroups | default | large | winner |
        |---|---|---|---|---|
        | 1024 | 32 | 0.017888 | 0.031512 | default, 1.76x |
        | 2048 | 16 | 0.080496 | 0.081640 | default, 1.4% |
        | 2048 | 32 | 0.080808 | 0.101192 | default, 25% |
        | 4096 | 16 | 0.336232 | 0.338520 | default, 0.7% |
        | 4096 | 32 | 0.335920 | 0.360464 | default, 7.3% |
        | 8192 | 32 | 1.332550 | 1.343370 | default, 0.8% |
        | 8192 | 16 | 1.347940 | 1.342120 | large, 0.4% |

      The single exception (8192, 16 subgroups) wins by 0.4% and is not the best
      config at that size. For this kernel family the answer is settled: take the
      default. None of these kernels spill at 128.

  - id: xegpu_1024_thread_workgroup_cannot_use_large_grf
    name: "A 1024-thread workgroup and large GRF cannot be combined; the launch fails outright"
    severity: critical
    stages: [analysis, device_specific, autotuning]
    precondition: |
      TRIGGER — report issue_type: missing_grf_mode, stage: device_specific, when a
      gpu.launch_func (or known_block_size) asks for MORE THAN 512 threads per
      workgroup AND the pipeline is given
      `igc-cmd-options=-ze-opt-large-register-file`. Read the thread count off
      `known_block_size = array<i32: T, 1, 1>` or the `threads in (%t, ...)` operand.
      Fix: drop the large-GRF flag, or halve the thread count.

      Worked example: `known_block_size = array<i32: 1024, 1, 1>` with
      `sg_layout = [1, 64]` on SIMD16 is 1024 threads. With large GRF that launch
      aborts. With default GRF it runs.

      Do NOT flag at 512 threads or below — those run in both modes.
    description: |
      This is a CORRECTNESS failure, not a slow path. The launch is rejected:

        L0 error 2013265939  =  0x78000013  =  ZE_RESULT_ERROR_INVALID_GROUP_SIZE_DIMENSION

      MEASURED 2026-09-16 on Arc B580, four for four. `sm_1024_sg64`,
      `sm_2048_sg64`, `sm_4096_sg64` and `sm_8192_sg64` all ask for 1024 threads.
      All four abort at large GRF. All four run clean at default GRF
      (`[ALLCLOSE: TRUE]`). No 512-thread or smaller kernel failed in either mode.

      WHY: `clinfo` reports `Max work group size 1024` for the B580. Large GRF gives
      each thread two register banks instead of one, which halves the maximum
      workgroup size to 512. So 1024 threads plus large GRF is not a bad tuning
      choice, it is an invalid request that the driver refuses.

      HOW THIS BITES AN AUTOTUNER: a GRF sweep that pairs "large GRF" with a
      1024-thread config gets a launch abort, which a harness may record as a failed
      correctness check rather than an invalid combination. Exclude the pair up front.
      Note the point is academic for performance anyway — 1024-thread workgroups lost
      at every size measured (see
      xegpu_row_per_subgroup_single_read_softmax for the grid).
    rationale: |
      Device limit, read from `clinfo`: B580 `Max work group size 1024`,
      `Global Memory cache size 18874368` (18 MiB L2). The large-GRF mode trades
      thread slots for registers (1280 -> 640 hardware threads on B580), and the
      per-workgroup ceiling halves with it.

      Not checked: whether the exact ceiling is 512 on other Xe parts, or whether a
      future IGC reports a clearer error.
    tags: [large_grf, workgroup_size, launch_failure, level_zero, device_specific, bmg, autotuning]
    applies_to: [any_xegpu_kernel, softmax, layernorm, reduction, flash_attention]

patterns:
  - id: xegpu_streaming_128bit_lane_load
    name: "Shape a streaming load_nd so each lane reads one contiguous 128-bit chunk; scale with sg_layout"
    stage: memory_access
    precondition: |
      APPLIES to an xegpu.load_nd of a tensor that is read ONCE (no reuse across
      the workgroup and no reuse across loop iterations) — a softmax/layernorm
      input row, an elementwise operand, a copy source. Match it on the access
      role, not on the workload name.

      Do NOT apply to DPAS operands: their layout is dictated by the DPAS shape
      and by reuse, and is covered by xegpu_layout_and_tiling.yaml /
      xegpu_widen_load_inst_data_in_pairs. Do NOT apply when the layout already
      gives 16 B/lane on the stride-1 axis (then the only remaining move is more
      subgroups).
    description: |
      Choose lane_data so each lane's fragment is a contiguous 16-byte run on the
      stride-1 dimension ([1,4] for f32, [1,8] for f16), put lane_layout along
      that same contiguous axis, and reach the tile size you want by growing
      sg_layout until the workgroup is full (1024 threads on BMG). Past that
      point a lane takes a second 16 B chunk, which costs a second message.
    rationale: |
      16 B/lane x 32 lanes = a 512 B message, two whole 256 B Xe2 cache lines,
      with no gaps and no partial-line traffic. Narrower per-lane runs
      under-fill the message; strided runs fetch lines the kernel does not use.
      Per-lane width saturates in hardware, so subgroup count is the dimension
      that actually scales.
    pattern_before: |
      // lane owns a strided pair -> gapped, partial-cacheline reads
      %in = xegpu.load_nd %in_tile[%row, %c0]
        <{layout = #xegpu.layout<sg_layout = [1, 8], sg_data = [64, 2],
                                 lane_layout = [16, 1], lane_data = [2, 1]>}>
        : !xegpu.tensor_desc<64x16xf32, #in> -> vector<64x16xf32>
    pattern_after: |
      // lane owns 4 contiguous f32 (16 B) on the stride-1 axis; tile grows via sg_layout
      %in = xegpu.load_nd %in_tile[%row, %c0]
        <{layout = #xegpu.layout<sg_layout = [8, 1], sg_data = [8, 64],
                                 lane_layout = [1, 16], lane_data = [1, 4]>,
          l1_hint = #xegpu.cache_hint<streaming>,
          l2_hint = #xegpu.cache_hint<streaming>}>
        : !xegpu.tensor_desc<64x64xf32, #in> -> vector<64x64xf32>
    expected_speedup: "1.1-1.5x when it fixes a gapped or narrow stream; ~1.0x if already at 16 B/lane"
    applies_to: ["any_read_once_load", "softmax", "layernorm", "elementwise", "reduction", "copy", "transpose"]
    notes: |
      PROVENANCE: OBSERVED in the Intel Triton backend on Arc B580 (sizePerThread
      pinned at 4 f32 across 1K-8K while warpsPerCTA grew 8/16/32/32; ISA
      `load.ugm.d32x4.a64 (32|M0)` = 512 B). NOT A/B measured on an MLIR kernel.
      The kernel carrying that layout ran at 396-402 GB/s = 87-88% of the 456 GB/s
      peak at 4096x4096 and 8192x8192, so 16 B/lane is demonstrably SUFFICIENT to
      saturate BMG DRAM; the speedup range above is the cost of NOT doing it.

  - id: xegpu_streaming_cache_hints_read_once_write_once
    name: "Tag read-once loads <streaming> and write-once stores <write_through> so the stream does not evict L2"
    stage: memory_access
    precondition: |
      APPLIES when the kernel's total footprint (bytes read + bytes written)
      EXCEEDS L2 (18 MiB on BMG) and the data has no reuse. Check the footprint
      first — see bw_working_set_must_exceed_l2_or_measurement_is_not_dram. If the
      whole working set fits in L2, <cached> is correct and this pattern is WRONG:
      you want the second pass to hit.

      Do NOT apply to an operand that other subgroups re-read (use
      xegpu_cache_hint_on_load with <cached>), and do NOT apply a read-only policy
      (<streaming>, <read_invalidate>) to a store or a write-only policy
      (<write_through>, <write_back>) to a load — that is invalid IR.
    description: |
      Annotate the streaming ends of the kernel explicitly. Loads of read-once
      input get l1/l2 `<streaming>`; stores of write-once output get
      `<write_through>` (or `<uncached>`). Leave `<cached>` for genuinely reused
      tiles. Prefetches, if any, should carry the same policy as the load they
      feed.
    rationale: |
      Default caching pulls every streamed line into L1/L2 and holds it, so a
      kernel larger than L2 spends the whole cache on data it will never read
      again. Marking the stream lets the hierarchy keep whatever DOES have reuse,
      and costs nothing on the streamed path itself.
    pattern_before: |
      %in = xegpu.load_nd  %in_tile[%row, %c0]  : !xegpu.tensor_desc<8x64xf32, #in> -> vector<8x64xf32>
      xegpu.store_nd %out, %out_tile[%row, %c0] : vector<8x64xf32>, !xegpu.tensor_desc<8x64xf32, #out>
    pattern_after: |
      %in = xegpu.load_nd %in_tile[%row, %c0]
        <{l1_hint = #xegpu.cache_hint<streaming>, l2_hint = #xegpu.cache_hint<streaming>}>
        : !xegpu.tensor_desc<8x64xf32, #in> -> vector<8x64xf32>
      xegpu.store_nd %out, %out_tile[%row, %c0]
        <{l1_hint = #xegpu.cache_hint<write_through>, l2_hint = #xegpu.cache_hint<write_through>}>
        : vector<8x64xf32>, !xegpu.tensor_desc<8x64xf32, #out>
    expected_speedup: "1.0-1.15x; largest when the kernel shares L2 with reused data, ~1.0x at the roofline"
    applies_to: ["any_read_once_load", "any_write_once_store", "softmax", "layernorm", "elementwise", "copy"]
    notes: |
      PROVENANCE: OBSERVED-AS-MISSING, not measured. Triton's
      TritonIntelGPUAnnotateCacheControl pass was a byte-for-byte no-op on the
      softmax data path, leaving default caching in the Xe2 ISA. The study did not
      A/B the hints because that kernel was already at 87-88% of DRAM peak, where
      no cache change can show up. So this is a HYPOTHESIS with a clear mechanism,
      not a confirmed win — the verifier must time it, and it is expected to be
      neutral on any kernel already at the roofline.

  - id: xegpu_unpredicated_stream_via_loop_versioning
    name: "Version the kernel on divisibility and drop boundary_check on BOTH the load and the store"
    stage: memory_access
    precondition: |
      APPLIES when a streaming load_nd/store_nd pair is predicated
      (boundary_check = true, or a vector.mask / arith.select guard) purely for
      out-of-range columns, AND the extent is either a compile-time multiple of the
      tile or a runtime value you can test once outside the hot loop.

      Do NOT apply when the mask encodes real algorithmic semantics (a causal
      mask, a padding value that must be observed) — only when it is a pure bounds
      guard. Do NOT drop boundary_check without the guard unless divisibility is
      static: an unpredicated out-of-range 2-D block access is a correctness bug,
      not a slow path.
    description: |
      Hoist the divisibility test out of the loop, clone the loop into two arms
      under scf.if, and in the fast arm use descriptors with
      `#xegpu.block_tdesc_attr<boundary_check = false>` for the input AND the
      output. Dropping the guard also deletes the padding constant and the
      arith.select that fed the reduction, which shortens the dependence chain
      ahead of the max/sum, not just the load itself.
    rationale: |
      Predication costs flag setup per message and prevents the unpredicated form
      of the access. On a streaming kernel there is one load and one store per
      element, so the predicate overhead is a fixed tax on 100% of the traffic.
      The padding value (-inf for a max, 0 for a sum) is extra materialization and
      an extra select that the fast arm does not need at all.
    pattern_before: |
      scf.for %row = %c0 to %M step %c1 {
        // masked in every iteration, and the -inf fill feeds the max reduction
        %in = xegpu.load_nd %in_tile[%row, %c0]
          : !xegpu.tensor_desc<1x4096xf32, #xegpu.block_tdesc_attr<boundary_check = true>> -> vector<1x4096xf32>
        %m  = vector.multi_reduction <maximumf>, %in, %neg_inf [1] : vector<1x4096xf32> to vector<1xf32>
        ...
        xegpu.store_nd %out, %out_tile[%row, %c0]
          : vector<1x4096xf32>, !xegpu.tensor_desc<1x4096xf32, #xegpu.block_tdesc_attr<boundary_check = true>>
      }
    pattern_after: |
      %exact = arith.cmpi eq, %n_cols, %c4096 : i1
      scf.if %exact {
        scf.for %row = %c0 to %M step %c1 {
          // fast arm: no predicate on EITHER end, no -inf fill
          %in = xegpu.load_nd %in_tile_nb[%row, %c0]
            : !xegpu.tensor_desc<1x4096xf32, #xegpu.block_tdesc_attr<boundary_check = false>> -> vector<1x4096xf32>
          %m  = vector.multi_reduction <maximumf>, %in, %first [1] : vector<1x4096xf32> to vector<1xf32>
          ...
          xegpu.store_nd %out, %out_tile_nb[%row, %c0]
            : vector<1x4096xf32>, !xegpu.tensor_desc<1x4096xf32, #xegpu.block_tdesc_attr<boundary_check = false>>
        }
      } else {
        // original masked loop, unchanged
      }
    expected_speedup: "1.05-1.2x on a predicated stream; the store half is the part compilers leave behind"
    applies_to: ["any_bounds_masked_stream", "softmax", "layernorm", "elementwise", "reduction"]
    notes: |
      PROVENANCE: the load half is OBSERVED shipping in a production compiler —
      Triton's TritonIntelRemoveMasks performs exactly this clone-under-scf.if and
      it survives to the Xe2 ISA as an unpredicated `load.ugm.d32x4.a64`
      alongside the `(f0.0)`-predicated one. The store half is OBSERVED-AS-MISSING:
      that pass is load-only by construction (assert at RemoveMasks.cpp:941), so
      `(f0.0) store.ugm.d32x4.a64` remained in both arms. Neither half was A/B
      timed in isolation; the 4096x4096 kernel containing both was at 86.8% of
      peak, which bounds how much either can be worth THERE. Expect the win below
      the roofline.

  - id: xegpu_hoist_reciprocal_for_row_normalization
    name: "Replace a per-element arith.divf by a row scalar with one reciprocal plus a multiply"
    stage: device_specific
    precondition: |
      APPLIES when a tile is divided elementwise by a value that is INVARIANT over
      the tile — a softmax denominator, a layernorm sigma, an L1/L2 norm, a mean,
      a count. Match on arith.divf whose denominator is a broadcast of a reduction
      result or of a loop-invariant scalar.

      Do NOT apply when the divisor varies per element (no reciprocal to hoist).
      Do NOT apply if the kernel is at or above ~85% of DRAM peak: it will be
      invisible there. Verify [ALLCLOSE] still passes if you add fastmath<afn> —
      the fast inverse is approximate.
    description: |
      Compute `%r = 1.0 / %denom` once, as a scalar, outside the elementwise work,
      then multiply the tile by the broadcast reciprocal. Tag the single division
      (or the multiply chain) with fastmath<afn> when the tolerance allows, so IGC
      selects the native inverse rather than the exact IEEE expansion.
    rationale: |
      IEEE-correct division is not one instruction. IGC expands each arith.divf
      into a scale, a scalar inverse, two SIMD-width multiplies and cmp/select
      fixups for denormals and infinities. Paying that per element instead of once
      per row multiplies a fixed overhead by the tile size, and the compiler will
      not strength-reduce it for you because the exact semantics forbid it.
    pattern_before: |
      %sum   = vector.multi_reduction <add>, %p, %zero [1] : vector<1x4096xf32> to vector<1xf32>
      %sum_b = vector.broadcast %sum : vector<1xf32> to vector<1x4096xf32>
      %y     = arith.divf %p, %sum_b : vector<1x4096xf32>     // 4096 IEEE divisions
    pattern_after: |
      %sum   = vector.multi_reduction <add>, %p, %zero [1] : vector<1x4096xf32> to vector<1xf32>
      %one   = arith.constant dense<1.0> : vector<1xf32>
      %r     = arith.divf %one, %sum fastmath<afn> : vector<1xf32>   // ONE inverse
      %r_b   = vector.broadcast %r : vector<1xf32> to vector<1x4096xf32>
      %y     = arith.mulf %p, %r_b : vector<1x4096xf32>              // 4096 multiplies
    expected_speedup: "1.0x at the DRAM roofline; up to ~1.1x on small, cache-resident, launch-bound shapes"
    applies_to: ["softmax", "layernorm", "rmsnorm", "l2_normalize", "mean_subtract", "any_divide_by_reduction_result"]
    notes: |
      PROVENANCE: OBSERVED-AS-MISSING in the Triton reference (fdiv survives to
      LLVM IR; the Xe2 ISA shows the scale + scalar math.inv + 2 SIMD32 mul +
      cmp/sel 1.0f fixup chain). UNMEASURED as an isolated change. The reason the
      expected value is honestly LOW is the roofline: the kernel where this was
      spotted sat at 87-88% of peak, so compute-side savings had nowhere to
      appear. The place it should pay is the 1024x1024 / 2048x2048 regime, which
      is L2-resident and where the same kernel lost to torch.softmax by ~20%.

  - id: xegpu_two_level_row_reduction_subgroup_then_slm
    name: "Finish a row reduction with one hardware subgroup reduce, then one-partial-per-subgroup through SLM"
    stage: algorithmic
    precondition: |
      APPLIES to a workgroup-level row reduction (vector.multi_reduction, or an
      scf.for reduction) whose reduced extent is spread across MORE THAN ONE
      subgroup, so the result needs cross-subgroup combination.

      Do NOT apply when the whole reduced extent lives in one subgroup (then the
      hardware subgroup reduce alone finishes it and no SLM or barrier is needed).
      This pattern is the CROSS-SUBGROUP half; the lane-private pre-reduction that
      should come first is xegpu_softmax_reduction_split_intra_lane.
    description: |
      Structure the reduction in three stages: (1) fold the elements each lane
      privately owns, in registers; (2) one cross-lane reduction over the subgroup,
      lowering to a single hardware subgroup-reduce instruction; (3) each subgroup
      writes ONE partial to SLM, one workgroup barrier, then one subgroup (or all,
      redundantly) reduces the `num_subgroups` partials and broadcasts.

      The SLM allocation is `num_subgroups * sizeof(elem)`. If it scales with the
      row length instead, stage 2 is missing and the row is being staged through
      SLM by hand.
    rationale: |
      Cross-lane shuffles and SLM round-trips are the expensive part of a
      reduction; register-local folding is free. Reducing to one value per lane,
      then one per subgroup, means the shuffle network runs once over a subgroup
      and SLM carries only tens of bytes. It also keeps SLM per workgroup small
      enough that SLM never caps how many workgroups fit on an Xe-core.
    pattern_before: |
      // whole row staged through SLM and reduced there: SLM scales with N
      %slm = memref.alloc() : memref<4096xf32, 3>      // one slot per ELEMENT
      // ... every lane writes its elements, barrier, log-tree in SLM ...
    pattern_after: |
      // 1. lane-private fold (registers, free)
      %part = vector.multi_reduction <add>, %lane_owned, %zero [1] : vector<8xNxf32> to vector<8xf32>
      // 2. one cross-lane reduce inside the subgroup -> one scalar per subgroup
      %sg_sum = gpu.subgroup_reduce add %part_scalar : (f32) -> f32
      // 3. one partial per SUBGROUP through SLM: SLM = num_sg * 4 B, not N * 4 B
      %slm = memref.alloc() : memref<32xf32, 3>        // one slot per SUBGROUP
      memref.store %sg_sum, %slm[%sg_id] : memref<32xf32, 3>
      gpu.barrier
      // ... reduce the 32 partials, broadcast ...
    expected_speedup: "1.1-1.4x vs an SLM-staged row reduction; also frees SLM, which can raise occupancy"
    applies_to: ["softmax", "layernorm", "rmsnorm", "logsumexp", "reduction", "flash_attention", "any_multi_subgroup_reduce"]
    notes: |
      PROVENANCE: OBSERVED (structure, plus measured SLM/barrier counts) in the
      Triton reference on Arc B580. Both softmax reductions lowered to a single
      `__spirv_GroupNonUniformFMax` / `__spirv_GroupNonUniformFAdd` per subgroup
      followed by SLM + barrier. SLM per workgroup was 32 / 64 / 128 / 128 bytes
      for row lengths 1024 / 2048 / 4096 / 8192 — flat in the row length, exactly
      num_subgroups * 4 B — and the barrier count was 12 at every size. The
      speedup range is versus a hand-rolled SLM tree and is NOT A/B measured; what
      IS established is that this structure is what a kernel running at 88% of
      DRAM peak uses.

  - id: xegpu_row_per_subgroup_single_read_softmax
    name: "Give ONE ROW to the whole WORKGROUP, split across its subgroups, and hold it in registers so the normalize pass does not re-read memory"
    stage: algorithmic
    precondition: |
      APPLIES to a row-wise normalization (softmax, layernorm, rmsnorm, logsumexp)
      written as TWO loops over the same input, where the second loop reloads the
      tile the first loop already read. Detect it by counting xegpu.load_nd ops
      that read the same base memref in different scf.for bodies.

      REQUIRES the row to fit in registers. Budget it off WORKGROUP threads, not
      subgroup lanes, because the row is split across all the subgroups:

        f32 per lane = row_len / threads_per_wg
        GRF-equivalents per lane = 2 * row_len / threads_per_wg   (row + exp array)

      With 256 threads that is 16 f32/lane at N=4096 and 32 at N=8192, and BOTH fit
      with no spills at 128 GRF. Raise threads_per_wg before giving up on a long row,
      but see the SIZING RULE below for the cap — it is 512, not 1024.

      Do NOT apply when the reduction axis is not the contiguous axis, or when the
      row is already register-resident (then there is only one load and nothing to
      remove).
    description: |
      Flip the decomposition. Instead of giving a workgroup many rows and stepping
      the column axis, give ONE ROW to the whole workgroup and split it across all
      the workgroup's subgroups. Keep the loaded row in a vector value, compute max
      and sum from it, then normalize and store that SAME value. The input is read
      exactly once.

      NAME IS MISLEADING, kept for stability: one row per WORKGROUP, not per
      subgroup. One row per SUBGROUP does not fit on the XeGPU path, which is
      SIMD16: a 4096-f32 row on 16 lanes is 256 f32/lane. MEASURED — pushing toward
      that shape loses. At 4096x4096, 2 rows per workgroup with 4 subgroups per row
      (64 f32/lane) ran 0.4595 ms against 0.3362 ms for 1 row per workgroup with 16
      subgroups (16 f32/lane). That is 37% slower.

      SIZING RULE, SWEPT 2026-09-16 — GIVE EACH LANE 8 f32:

        threads_per_wg = min(row_len / 8, 512)
        subgroups      = threads_per_wg / 16      (SIMD16)

      That is 128 threads at N=1024, 256 at N=2048, 512 at N=4096, 512 at N=8192.
      The 8-f32-per-lane point won at 1K, 2K and 4K and was within 0.5% of the
      winner at 8K. Full grid, BMG B580, default GRF, medians in ms:

        | f32/lane | threads | N=1024 | N=2048 | N=4096 | N=8192 |
        |---|---|---|---|---|---|
        | 1 | N/1 | 0.040144 | - | - | - |
        | 2 | N/2 | 0.017888 | 0.112632 | - | - |
        | 4 | N/4 | 0.014352 | 0.080808 | 0.361400 | - |
        | 8 | N/8 | **0.010920** | **0.080496** | **0.335920** | 1.339830 |
        | 16 | N/16 | 0.012168 | 0.082264 | 0.336232 | **1.332550** |
        | 32 | N/32 | - | - | 0.340808 | 1.347940 |

      At N=8192 the 8-f32-per-lane point needs 1024 threads, which the cap forbids,
      and the 512-thread (16 f32/lane) point wins there anyway — 1.332550 against
      1.339830. So the cap costs nothing.

      BOTH TAILS ARE REAL. Too few f32 per lane starves the lane and multiplies
      barrier work: 1 f32/lane at N=1024 is 3.7x SLOWER than the best. Too many
      raises register pressure for nothing: 32 f32/lane costs 1.2-1.5%.

      MORE SUBGROUPS PER ROW IS BETTER ONLY UP TO 8 f32 PER LANE, then it reverses.
      Measured at 4096x4096, default GRF: 8 subgroups 0.340808, 16 subgroups
      0.336232, 32 subgroups 0.335920, 64 subgroups 0.361400. The earlier version of
      this entry said "more is better up to the workgroup limit" — that was
      extrapolated from two points and the sweep shows it turns over.

      NEVER USE 1024 THREADS PER WORKGROUP. It lost at all four sizes (3.7x worse at
      1K, 1.40x at 2K, 1.08x at 4K, 1.005x at 8K) and it CANNOT LAUNCH at large GRF
      at all — see xegpu_1024_thread_workgroup_cannot_use_large_grf.

      The reduce axis now CROSSES subgroups, so the workgroup pass inserts an SLM
      stage (128 B) and one barrier, and the combining kind must stay `<maximumf>`
      (see xegpu_intra_subgroup_max_should_be_maxnumf for why). That cost is small:
      2 `sync.bar` in the final ISA.

      When the row is too long for registers even at 1024 threads, split it into
      panels sized to the register budget and keep only the LAST panel live; the
      earlier panels still re-read, so an R-panel split costs (1 + (R-1)/R) reads
      instead of 2.
    rationale: |
      A two-loop online softmax moves 3*N*N*4 bytes where the algorithm needs
      2*N*N*4. For a kernel whose only limit is DRAM, that extra pass IS the
      runtime: 3/2 = 1.5x. Cutting it is the single largest available win, and it
      is the only kind of change that helps at all once the pipe is full — cache
      hints, prefetch and cheaper transcendentals cannot reduce min_bytes.
    pattern_before: |
      // 3 passes: loop 1 reads to reduce, loop 2 READS THE SAME DATA AGAIN
      %stats:2 = scf.for %j = %c0 to %N step %c16 iter_args(%mx = %ninf, %sum = %zero) -> (...) {
        %t  = xegpu.load_nd %in[%row, %j] : ... -> vector<64x16xf32>
        %m  = vector.multi_reduction <maximumf>, %t, %mx [1] : ...
        %s  = vector.multi_reduction <add>, %e, %sum [1] : ...
        scf.yield %m, %s : vector<64xf32>, vector<64xf32>
      }
      scf.for %j = %c0 to %N step %c16 {
        %t = xegpu.load_nd %in[%row, %j] : ... -> vector<64x16xf32>   // SECOND READ
        %o = arith.divf %e, %sumb : vector<64x16xf32>
        xegpu.store_nd %o, %out[0, %j] : ...
      }
    pattern_after: |
      // 2 passes: ONE ROW per WORKGROUP, split across 16 subgroups (256 threads),
      // held in registers across both phases. This is the measured 1.982x kernel.
      // Launch: 4096 workgroups x 256 work-items. 4096/256 = 16 f32 per lane.
      %bid = gpu.block_id x
      %in_tdesc  = xegpu.create_nd_tdesc %arg0 : memref<4096x4096xf32>
        -> !xegpu.tensor_desc<1x4096xf32, #xegpu.block_tdesc_attr<boundary_check = false>>
      %out_tdesc = xegpu.create_nd_tdesc %arg1 : memref<4096x4096xf32>
        -> !xegpu.tensor_desc<1x4096xf32, #xegpu.block_tdesc_attr<boundary_check = false>>
      // read the row ONCE and keep it live
      %row_v = xegpu.load_nd %in_tdesc[%bid, %c0]
        <{l1_hint = #xegpu.cache_hint<cached>, l2_hint = #xegpu.cache_hint<cached>}>
        : !xegpu.tensor_desc<1x4096xf32, ...> -> vector<1x4096xf32>
      %mx  = vector.multi_reduction <maximumf>, %row_v, %ninf [1] : vector<1x4096xf32> to vector<1xf32>
      %mb  = vector.broadcast %mx : vector<1xf32> to vector<1x4096xf32>   // size-1 dim stretches
      %sh  = arith.subf %row_v, %mb : vector<1x4096xf32>
      %e   = math.exp %sh fastmath<fast> : vector<1x4096xf32>       // reuses %row_v, no reload
      %sum = vector.multi_reduction <add>, %e, %zero [1] : vector<1x4096xf32> to vector<1xf32>
      %sb  = vector.broadcast %sum : vector<1xf32> to vector<1x4096xf32>
      %o   = arith.divf %e, %sb : vector<1x4096xf32>
      xegpu.store_nd %o, %out_tdesc[%bid, %c0]
        <{layout = #xegpu.layout<sg_layout = [1, 16], sg_data = [1, 256]>}>
        : vector<1x4096xf32>, !xegpu.tensor_desc<1x4096xf32, ...>
