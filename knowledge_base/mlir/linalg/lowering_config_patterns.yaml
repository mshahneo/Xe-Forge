# Linalg -> XeGPU WG lowering config: tunable tile / subgroup parameters.
#
# These are the knobs of the Linalg->WG lowering itself (pipelines/linalg_to_wg).
# A config is the 5-tuple (wg_m, wg_n, sg_m, sg_n, k_tile); every #xegpu.layout is
# derived from it (see xe_forge.core.linalg_lowering.LoweringConfig). The optimizer
# proposes configs; the CoVeR gate verifies each by lowering + running on the GPU.
#
# Target: Intel Xe2 (Battlemage) — SIMD16 subgroups, XMX/DPAS tiles A=[8,16]
# B=[16,16] C=[8,16]. Max 1024 work-items per workgroup.

constraints:
  - id: lowering_wg_divisible_by_sg
    name: Workgroup tile must be divisible by subgroup tile
    severity: critical
    description: |
      wg_m % sg_m == 0 and wg_n % sg_n == 0. The subgroup grid is
      [wg_m/sg_m, wg_n/sg_n]; non-divisible tiles fail to lower.

  - id: lowering_sg_dpas_aligned
    name: Subgroup + k tiles must be multiples of the DPAS shape
    severity: critical
    description: |
      sg_m % 8 == 0, sg_n % 16 == 0, k_tile % 16 == 0 (DPAS A=[8,16], B=[16,16]).
      Misaligned tiles either fail to lower or fall off the XMX path.

  - id: lowering_threads_le_1024
    name: Threads per workgroup must not exceed 1024
    severity: critical
    description: |
      nb_threads = (wg_m/sg_m) * (wg_n/sg_n) * 16 must be <= 1024. Equivalently,
      the number of subgroups per workgroup must be <= 64. Larger tiles need
      larger sg tiles to stay within budget.

  - id: lowering_shape_divisible
    name: Problem dims should be divisible by the tile sizes
    severity: high
    description: |
      For a GEMM MxNxK: M % wg_m == 0, N % wg_n == 0, K % k_tile == 0. If not,
      choose smaller tiles (boundary handling is not yet generated).

  - id: lowering_large_grf_max_32_subgroups
    name: Large register file requires <=32 subgroups per workgroup
    severity: critical
    description: |
      Intel Xe (BMG) large-GRF mode doubles per-thread registers but halves the
      subgroup budget: with large_grf=true, (wg_m/sg_m)*(wg_n/sg_n) must be <= 32
      (vs 64 default). It is applied at lowering time via the igc option
      igc-cmd-options=-ze-opt-large-register-file. Pair it with larger subgroup
      tiles (fewer, heavier subgroups) — that is exactly the register-pressure
      regime where the extra GRF pays off.

patterns:
  - id: lowering_config_balanced_256
    name: Balanced 256x256 WG tile (default, compute-bound GEMM)
    stage: device_specific
    description: |
      wg=[256,256] sg=[32,32] k_tile=32 -> subgroup grid [8,8], 1024 threads.
      Large square tile maximizes DPAS reuse; the proven Phase-0 default. Best
      when M,N are large multiples of 256 and the kernel is compute-bound.
    expected_speedup: "baseline for large GEMM"
    applies_to: ["gemm", "matmul"]

  - id: lowering_config_skinny_m
    name: 128x256 WG tile for skinny-M or register-pressure cases
    stage: device_specific
    description: |
      wg=[128,256] sg=[32,32] k_tile=32 -> subgroup grid [4,8], 512 threads.
      Fewer threads / smaller M tile: use when M is small, when the 256x256 tile
      spills GRF, or to raise occupancy on memory-bound shapes.
    expected_speedup: "wins on skinny-M / high-register-pressure kernels"
    applies_to: ["gemm", "matmul"]

  - id: lowering_config_large_ktile
    name: Larger k_tile to amortize load latency
    stage: device_specific
    description: |
      wg=[256,256] sg=[32,32] k_tile=64 -> more DPAS issues per K iteration,
      fewer loop iterations. Trades register pressure for reduced load overhead;
      try when the K dimension is large and the kernel is memory-latency bound.
    expected_speedup: "1.05-1.3x on large-K, latency-bound GEMM"
    applies_to: ["gemm", "matmul"]

  - id: lowering_config_small_tile_odd_shapes
    name: 128x128 WG tile for smaller / less-divisible shapes
    stage: device_specific
    description: |
      wg=[128,128] sg=[32,32] k_tile=32 -> subgroup grid [4,4], 256 threads.
      Use when M or N is not divisible by 256; smaller tiles fit more shapes and
      raise occupancy at the cost of per-tile arithmetic intensity.
    expected_speedup: "enables shapes not divisible by 256; may be slower per tile"
    applies_to: ["gemm", "matmul"]

  - id: lowering_config_large_grf_heavy_subgroup
    name: Large register file with heavy subgroup tiles (<=32 subgroups)
    stage: device_specific
    description: |
      BEST-MEASURED 4K GEMM config on BMG: wg=[256,256] sg=[32,64] k_tile=32
      large_grf=true -> subgroup grid [8,4], 32 subgroups, 512 threads. Measured
      ~98 TFLOPS (IMEX profiling), matching/beating the hand-written reference WG
      kernel — vs ~70 TFLOPS for the small-GRF 64-subgroup sg=[32,32] default.
      The heavier per-subgroup N tile (sg_n=64) raises register pressure, which is
      exactly where BMG large-GRF (2x GRF/thread, at the cost of halving the
      subgroup budget to 32) pays off. Always propose this large-GRF config for a
      compute-bound GEMM; also try sg=[64,32] (heavy-M) as a variant — the timed
      sweep picks the faster. large_grf caps subgroups at 32, so pair it with
      larger sg tiles (sg_m*... keeping (wg_m/sg_m)*(wg_n/sg_n) <= 32).
    expected_speedup: "~1.4x vs small-GRF 64-subgroup default (70 -> 98 TFLOPS on 4K)"
    applies_to: ["gemm", "matmul"]

  - id: lowering_autotune_tile
    name: Autotune the tile config by timing candidates (don't take first-divisible)
    stage: device_specific
    description: |
      The first tile that divides a shape is usually NOT the fastest — the large-GRF
      heavy-subgroup variants win on compute-bound GEMM. Two mechanisms exist:
        (1) MlirExecutor.sweep_configs — the LLM/pipeline path: lowers each proposed
            config, times via the plain-GEMM profiling harness, ranks by ms. Assumes
            the plain-matmul harness ABI (C,A,B; B is KxN).
        (2) MlirExecutor.autotune_tile — ABI-AGNOSTIC: for each candidate it lowers,
            synthesizes a single-launch timing harness from the kernel's own gpu.func
            signature (attention_lowering.synthesize_run_harness, given an explicit
            grid = (M/wg_m, N/wg_n, 1) since matmul/transpose-B kernels use a 2-D
            block_id grid; MLP epilogue-tiled kernels collapse to 1-D), times via IMEX
            profiling, picks fastest. Works for plain/transpose-B matmul, MLP layer,
            elementwise-epilogue GEMM. Timing-only (uninitialized buffers) — assumes
            all candidates compute the same math; pair with a correctness gate.
            GRID: auto-detected per candidate — 2-D (M/wg_m, N/wg_n) when the kernel
            uses block_id y, else 1-D ((M/wg_m)*(N/wg_n)); the dimensionality varies
            with the tile for MLP-layer kernels, so this must be detected not assumed.
      WIRED INTO MLP: lower_mlp_to_wg(autotune=True) autotunes each distinct layer
      shape's tile (parse_mlp caches by shape). Restricted to default-GRF candidates
      there (the multi-kernel MLP recipe has no per-layer igc flag).
      candidate_configs(m,n,k) gives a curated, shape-filtered shortlist (default +
      large-GRF sg=[32,64]/[64,32] + a few WG sizes + larger k-tile), default-first.
      LinalgLoweringAgent.propose falls back to it when the LLM is unavailable, so
      the timed sweep autotunes even with no LLM.
      MEASURED (autotune_tile, IMEX): plain matmul 4096^3 -> large-GRF sg=[64,32]
      63.6 TFLOPS vs sg=[32,32] default 55 TFLOPS (~16% faster, the tile a
      first-divisible picker would have missed); transpose-B 2048x4096x8192 ->
      wg=[256,128] 2.49ms vs wg=[256,256] 2.53ms.
    expected_speedup: "~1.15-1.4x over first-divisible tile on compute-bound GEMM"
    applies_to: ["gemm", "matmul", "mlp"]
