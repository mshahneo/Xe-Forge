# Linalg->XeGPU-WG lowering: scope, batched/attention findings, and tooling notes.
# These are hard-won engineering learnings (not per-kernel optimization patterns);
# they guide what the lowering can/can't do today and how to extend it.

constraints:
  - id: lowering_supports_plain_matmul_only
    name: The lowering pipeline currently supports a single linalg.matmul
    severity: critical
    description: |
      The Linalg->XeGPU-WG transform pipeline (pipelines/linalg_to_wg) matches and
      lowers exactly ONE linalg.matmul: tile_using_forall [wg_m, wg_n] -> k-loop ->
      vectorize(contract) -> subset-hoist (register accumulator) -> bufferize ->
      GPU outline -> convert-vector-to-xegpu -> WG layout anchor.
      linalg.batch_matmul IS now also handled via a dedicated stage-1 template
      (see lowering_batch_matmul_supported: one batch per workgroup + rank-reduce +
      cast-away-leading-unit-dim). Still NOT handled: linalg.softmax,
      linalg.transpose, linalg.generic, and fully fused attention (feeding the raw
      Linalg to the WG pipeline fails with "expected add/mul op in the body");
      fused attention is routed to the lighthouse dump path
      (attention_lowering_via_lighthouse_dump) instead.

  - id: lowering_batch_matmul_supported
    name: batch_matmul lowers to XeGPU-WG (fixed) — the crash was a rank-3 scatter fill, not i64 ptrs
    severity: info
    description: |
      linalg.batch_matmul now lowers end-to-end and runs CORRECTLY on BMG for both
      square and non-square shapes (verified 0 mismatches: 4x256x256x256 /262144;
      2x512x256x128 /262144; 3x384x512x64 /589824). Recipe (stage-1 template
      pipelines/linalg_to_wg/templates/tile_vectorize_batch.mlir.j2, auto-selected by
      lower_linalg_to_wg when the input contains linalg.batch_matmul; stages 2/3 are
      shared with the plain-matmul path):
        tile_using_forall [1, wg_m, wg_n]  (one batch per workgroup; grid becomes
          [batch, M/wg_m, N/wg_n])
        + fuse fill
        + "test-linalg-rank-reduce-contraction-ops" (func-scoped; collapses the
          batch=1 matmul to a 2-D linalg.matmul) + canonicalize
        + tile_using_for [0, 0, k_tile] on the resulting 2-D linalg.matmul
          (NOT [0,0,0,k_tile] on the 4-D op — see ORDERING below)
        + vectorize {fold_type_extensions_into_contract}
        + CAST-AWAY-LEADING-UNIT-DIM (fixes the scatter-fill segfault)
        + hoist/canonicalize/bufferize/forall->gpu/set_gpu_launch_threads.
      ORDERING (critical for non-square): rank-reduce+canonicalize BEFORE k-tiling,
      and tile k on the 2-D matmul. If k is tiled on the 4-D op first, the k-loop
      carries a 1 x wg_m x wg_n accumulator with a collapse_shape inside;
      loop-invariant-subset-hoisting can't fold the zero-fill through that reshape,
      leaving an accumulator transfer_read on a DYNAMIC-stride memref
      (strided<[?,?]>) that convert-vector-to-xegpu rejects on non-square shapes
      ("Failed to update operation with the layout"). Rank-reducing first makes the
      k-loop carry a clean 2-D vector<wg_m x wg_n> iter_arg (arith.constant
      dense<0.0>), exactly like the plain-matmul path -> no accumulator
      transfer_read survives, works for square AND non-square.
      ROOT CAUSE (corrected — the earlier "i64-pointer tdesc" theory was WRONG; the
      plain-matmul path also tdescs from i64 pointers and works fine): after
      rank-reduction the *inner matmul* is cleanly 2-D, but the *fused zero-fill*
      stays rank-3 (vector<1 x wg_m x wg_n> transfer_write). convert-vector-to-xegpu
      turns that rank-3 unit-leading write into a SCATTER `xegpu.store` (indices +
      mask, no layout attr). gpu-lower-to-xevm then crashes in
      XeGPUPropagateLayout -> inferMaskOffsetLayoutForScatterIO ->
      DistributeLayoutAttr::getRank() on a NULL layout (SIGSEGV, rc=139, no
      diagnostic). FIX: apply transform.apply_patterns.vector.{
      cast_away_vector_leading_one_dim, drop_unit_dims_with_shape_cast} after
      vectorize so the rank-3 fill becomes a clean 2-D block transfer_write ->
      lowers to xegpu.store_nd (block), no scatter, no crash.
      GOTCHA: launch grid + threads must match the tiling. grid = [batch, M/wg_m,
      N/wg_n]; threads = (wg_m/sg_m)*(wg_n/sg_n)*16. wg=256x256 sg=32x32 -> sg grid
      [8,8] = 64 subgroups = 1024 threads (not 512). A wrong thread count computes
      only part of each tile (corners read 0); a wrong grid computes only some tiles
      (e.g. launching (batch,1,1) for an M=512 wg_m=128 kernel covers 1 of 4 M-tiles
      -> 75% of the output stays zero) even though the lowering itself is correct.

  - id: lowering_no_linalg_in_host_harness
    name: Keep linalg ops out of the host @main harness
    severity: high
    description: |
      The WG lowering pipeline (gpu-lower-to-xevm) only handles the XeGPU kernel;
      linalg ops (e.g. linalg.fill) left in the host @main crash/deadend the
      pipeline. Fill host buffers with scf.for + memref.store, not linalg.fill.

  - id: lowering_lighthouse_reuse
    name: lighthouse offers only an MLP/matmul schedule (no attention), on the same upstream ops
    severity: info
    description: |
      The local lighthouse clone (/home/gta/lighthouse) has ONE xegpu schedule:
      mlp_schedule.py (matmul/MLP). There is NO attention/softmax/flash schedule to
      reuse. Its get_schedule_module emits a standard MLIR transform module via the
      upstream mlir.dialects.transform Python bindings (structured.tile_using_for,
      vectorize_children, loop.forall_to_parallel, xegpu.insert_prefetch,
      set_gpu_launch_threads, set_op_layout_attr, convert_layout) — the same class
      of ops our hand-written transform libraries use. So: it is reusable as a
      dumped .mlir (independence-friendly), but for matmul we already encode these
      ideas; for attention there is nothing there to reuse. Stay independent; a
      flash-attention lowering must be built (fuse QK^T + softmax + PV, tiled, no
      materialized scores tensor).

  - id: attention_wg_large_grf_win
    name: Lighthouse fused-attention WG kernel gains 1.73x from large-GRF
    severity: info
    description: |
      The lighthouse fused flash-attention WG kernel (fused_attention.py output,
      QK^T + softmax + PV in one gpu.func, 2x8x4096x64 f16, grid 16x32x1, 128
      threads) does NOT request large register file, but is register-pressure
      bound (128x64 accumulators). Adding the igc pipeline option
      igc-cmd-options=-ze-opt-large-register-file drops it from 4.46ms -> 2.58ms
      (1.73x, IMEX profiling). This is exactly the device-specific lever Xe-Forge
      should auto-apply to attention kernels. Note: the kernel uses inst_data
      [8,16]/[16,16] (NOT array_length [32,32]) despite the filename, so there may
      be further headroom via array_length loads.

  - id: attention_lowering_via_lighthouse_dump
    name: Fused-attention Linalg lowers to WG by reusing lighthouse's --dump-kernel
    severity: info
    description: |
      The fused-attention Linalg graph (transpose + batch_matmul QK^T + scale +
      softmax + batch_matmul PV) is out of our single-matmul pipeline's scope, but
      it lowers end-to-end by reusing lighthouse's schedule as a *lowering engine*:
      `examples/xegpu/fused_attention.py --dump-kernel=xegpu-wg --batch-size=Z
      --num-heads=H --n-ctx=n_ctx --n-head=n_head` emits exactly the reference
      WG kernel (@payload_kernel gpu.module) and EXITS without running — pure IR,
      no GPU needed (~0.6s via /home/gta/.venv/bin/python which has lighthouse
      pip-installed; also `uv run` from /data/gta/upstream/lighthouse). We consume
      the dumped .mlir only (independence-friendly: no run-time lighthouse dep).
      Implemented in src/xe_forge/core/attention_lowering.py:
      detect_attention_shape (2 batch_matmul + softmax -> (Z,H,n_ctx,n_head) from
      the 4-D memref), lower_attention_to_wg (shells out), synthesize_run_harness
      (parses gpu.func known_grid_size/known_block_size + arg memref types, emits a
      single-launch @main that gpu.allocs one buffer per kernel arg). Wired into
      pipeline._maybe_lower_linalg (attention branch when extract_matmul_dims is
      None). The dumped kernel has NOT chosen a GRF mode, so the pipeline sets
      _grf_sweep_after_lowering to run the GRF sweep on it -> autonomous ~1.76x
      (4.47->2.55ms) on the 2x8x4096x64 shape. Full CLI e2e verified from the raw
      linalg_input.mlir: LINALG_LOWERING (lighthouse) + DEVICE_SPECIFIC (GRF) = 2
      stages, output is WG-level (0 batch_matmul/softmax, xegpu.dpas + launch).
      NOTE: the synthesized harness leaves buffers uninitialized (no allclose) —
      valid ONLY because the GRF sweep compares identical IR (correctness-free);
      it is a timing harness, not a verify harness (see
      attention_verify_harness_is_expensive for the real-oracle problem).

  - id: attention_verify_harness_is_expensive
    name: Verifying an attention WG kernel needs a costly CPU reference
    severity: high
    description: |
      Xe-Forge's WG path requires each kernel file to self-verify with an in-file
      [ALLCLOSE]. Lighthouse attention outputs (@__benchmark/@payload form) have
      NO @main entry point and NO correctness oracle, so the executor can't run or
      verify them and the CoVeR gate is blind. Building an in-MLIR oracle is
      possible but expensive: the reference is the linalg attention
      (transpose + batch_matmul + softmax + batch_matmul); linalg.softmax lowers
      to CPU only after transform.structured.decompose_interface (a plain
      convert-linalg-to-loops leaves it), then generalize + bufferize + loops
      gives 0 linalg. BUT the reference materializes and scalar-loops a
      16x4096x4096 scores tensor on CPU -> impractically slow per-verify (minutes),
      making the CoVeR loop unusable at this size. Options for a usable oracle:
      (a) verify at a SMALL shape (e.g. 1x1x256x64) then apply the found config at
      4k; (b) GPU-computed reference (run a trusted kernel variant, dump output,
      allclose in numpy) rather than CPU loops; (c) tolerance-free self-comparison
      for layout-only changes that must be bitwise-identical.
